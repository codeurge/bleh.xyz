# Alert rules for bleh.xyz. Each alert names its runbook section in
# docs/operations/incident.md or observability.md. Severity:
#   page     wake someone (availability or integrity at risk now)
#   ticket   fix within a working day
#   info     visible on the dashboard, no notification
groups:
  - name: bleh-ingest
    rules:
      - alert: BlehAllIngestPathsDown
        expr: sum(up{job="hl-node-reader"}) == 0 or absent(up{job="hl-node-reader"})
        for: 1m
        labels: {severity: page}
        annotations:
          summary: No Hyperliquid ingest path is up
          runbook: docs/operations/incident.md#both-ingest-paths-down

      - alert: BlehIngestPathDown
        expr: up{job="hl-node-reader"} == 0
        for: 3m
        labels: {severity: ticket}
        annotations:
          summary: "Ingest path {{ $labels.path }} ({{ $labels.instance }}) is down; running on one path"
          runbook: docs/operations/incident.md#one-ingest-path-down

      - alert: BlehNodeBehindChain
        # Node block_time vs wall clock. Hyperliquid produces blocks
        # continuously, so more than 10 s means the node is not applying
        # blocks (peer loss, upgrade, crash).
        expr: time() - bleh_reader_last_block_time_seconds > 10
        for: 2m
        labels: {severity: ticket}
        annotations:
          summary: "Node on path {{ $labels.path }} is {{ $value | humanizeDuration }} behind the chain"
          runbook: docs/operations/node.md#node-not-applying-blocks

      - alert: BlehNodeStalled
        expr: time() - bleh_reader_last_block_time_seconds > 120
        for: 1m
        labels: {severity: page}
        annotations:
          summary: "Node on path {{ $labels.path }} has applied no block for 2 minutes"
          runbook: docs/operations/node.md#node-not-applying-blocks

      - alert: BlehReaderIngestLagHigh
        # Reader receive time minus node local write time; part of the
        # 50 ms end-to-end budget.
        expr: bleh:reader_ingest_lag_seconds:p99_5m > 0.025
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "Reader on path {{ $labels.path }}: p99 ingest lag {{ $value | humanizeDuration }} (> 25 ms)"
          runbook: docs/operations/observability.md#latency-budget

      - alert: BlehPathBehind
        expr: bleh:dedupe_path_blocks_behind > 50
        for: 2m
        labels: {severity: ticket}
        annotations:
          summary: "Path {{ $labels.path }} is {{ $value }} blocks behind the leading path"
          runbook: docs/operations/incident.md#one-ingest-path-down

      - alert: BlehIntegrityMismatch
        # The two ingest paths disagree on a (block, event_index).
        expr: increase(bleh_dedupe_mismatch_total[5m]) > 0
        labels: {severity: page}
        annotations:
          summary: "Integrity mismatch between ingest paths on stream {{ $labels.stream }}"
          runbook: docs/operations/incident.md#node-divergence

      - alert: BlehSeqGaps
        expr: sum by (path) (bleh:reader_seq_gaps:rate10m) * 600 > 3
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "Path {{ $labels.path }}: more than 3 sequence gaps per 10 minutes"
          runbook: docs/operations/incident.md#gaps-and-resnapshots

      - alert: BlehResnapshotRateHigh
        expr: sum by (site) (bleh:gateway_resnapshots:rate10m) * 600 > 10
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "Gateway {{ $labels.site }}: more than 10 forced re-snapshots per 10 minutes"
          runbook: docs/operations/incident.md#gaps-and-resnapshots

      - alert: BlehBookReconcileMismatch
        expr: increase(bleh_book_reconcile_mismatch_total[15m]) > 0
        labels: {severity: ticket}
        annotations:
          summary: "Book reconciliation against the node L4 snapshot failed on path {{ $labels.path }}"
          runbook: docs/operations/incident.md#gaps-and-resnapshots

      - alert: BlehSnapshotRequestsFailing
        expr: increase(bleh_reader_snapshot_failures_total[30m]) > 2
        labels: {severity: ticket}
        annotations:
          summary: "fileSnapshot requests to the node info server are failing on path {{ $labels.path }}"
          runbook: docs/operations/node.md#info-server

  - name: bleh-schema-drift
    rules:
      - alert: BlehSchemaDriftLive
        # The reader saw an unknown field or shape and stopped that kind
        # (hl-visor upgrades hl-node without notice).
        expr: increase(bleh_reader_schema_unknown_total[10m]) > 0 or bleh_reader_stream_halted == 1
        labels: {severity: page}
        annotations:
          summary: "Schema drift on path {{ $labels.path }}, stream {{ $labels.stream }}"
          runbook: docs/operations/upgrades.md#schema-drift

      - alert: BlehSchemaDriftCheckFailed
        # Scheduled comparison of node output against the format spec
        # (deploy/scripts/schema-drift-check.sh).
        expr: bleh_schema_drift_ok == 0
        labels: {severity: page}
        annotations:
          summary: "Scheduled schema check found drift on {{ $labels.instance }}"
          runbook: docs/operations/upgrades.md#schema-drift

      - alert: BlehSchemaDriftCheckStale
        expr: time() - bleh_schema_drift_last_run_timestamp_seconds > 7200
        labels: {severity: ticket}
        annotations:
          summary: "Schema drift check has not run for 2 hours on {{ $labels.instance }}"
          runbook: docs/operations/upgrades.md#schema-drift

      - alert: BlehNodeBinaryChanged
        # hl-visor installed a new hl-node. Not an error: a prompt to watch
        # drift alerts and to note the upgrade on the status page.
        expr: time() - bleh_hl_node_binary_changed_timestamp_seconds < 3600
        labels: {severity: info}
        annotations:
          summary: "hl-node binary changed on {{ $labels.instance }}"
          runbook: docs/operations/upgrades.md#hl-visor-upgrades

  - name: bleh-gateway
    rules:
      - alert: BlehPublishLatencyP99High
        expr: bleh:gateway_publish_latency_seconds:p99_5m > 0.05
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "Gateway {{ $labels.site }}: p99 publish latency {{ $value | humanizeDuration }} exceeds 50 ms"
          runbook: docs/operations/observability.md#latency-budget

      - alert: BlehPublishLatencyP99Critical
        expr: bleh:gateway_publish_latency_seconds:p99_5m > 0.25
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "Gateway {{ $labels.site }}: p99 publish latency {{ $value | humanizeDuration }}"
          runbook: docs/operations/observability.md#latency-budget

      - alert: BlehGatewayDown
        expr: up{job="gateway"} == 0
        for: 2m
        labels: {severity: ticket}
        annotations:
          summary: "Gateway {{ $labels.instance }} is down"
          runbook: docs/operations/incident.md#gateway-down

      - alert: BlehAllGatewaysDown
        expr: sum(up{job="gateway"}) == 0 or absent(up{job="gateway"})
        for: 1m
        labels: {severity: page}
        annotations:
          summary: No gateway is up
          runbook: docs/operations/incident.md#gateway-down

      - alert: BlehGatewayStalled
        # The protocol calls a stream stalled after 2 s without a block.
        expr: bleh_gateway_block_lag_seconds > 5
        for: 1m
        labels: {severity: page}
        annotations:
          summary: "Gateway {{ $labels.site }} has sent no block for {{ $value | humanizeDuration }}"
          runbook: docs/operations/incident.md#gateway-down

      - alert: BlehGatewayUpstreamLost
        expr: bleh_gateway_upstream_connected == 0
        for: 2m
        labels: {severity: ticket}
        annotations:
          summary: "Gateway {{ $labels.site }} lost upstream {{ $labels.upstream }}"
          runbook: docs/operations/incident.md#one-ingest-path-down

      - alert: BlehSlowConsumerCloses
        expr: sum by (site) (rate(bleh_gateway_slow_consumer_closes_total[10m])) * 600 > 100
        for: 15m
        labels: {severity: info}
        annotations:
          summary: "Gateway {{ $labels.site }}: many slow-consumer disconnects"
          runbook: docs/operations/observability.md#clients

  - name: bleh-availability
    rules:
      - alert: BlehProbeFailing
        # Three of the last five one-minute probes failed.
        expr: bleh:probe_success:ratio_5m < 0.6
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "External probe {{ $labels.target }} is failing"
          runbook: docs/operations/incident.md#public-endpoint-unavailable

      - alert: BlehAvailabilityFastBurn
        # 99.9% over 30 days leaves a 0.1% error budget. A 14.4x burn over
        # 1 h (confirmed over 5 m) spends 2% of the month's budget per hour.
        expr: |
          (1 - bleh:probe_success:ratio_1h) > (14.4 * 0.001)
            and
          (1 - bleh:probe_success:ratio_5m) > (14.4 * 0.001)
        labels: {severity: page}
        annotations:
          summary: "Availability budget burning fast for {{ $labels.target }}"
          runbook: docs/operations/incident.md#public-endpoint-unavailable

      - alert: BlehAvailabilitySlowBurn
        expr: |
          (1 - bleh:probe_success:ratio_6h) > (6 * 0.001)
            and
          (1 - bleh:probe_success:ratio_30m) > (6 * 0.001)
        labels: {severity: ticket}
        annotations:
          summary: "Availability budget burning for {{ $labels.target }}"
          runbook: docs/operations/incident.md#public-endpoint-unavailable

      - alert: BlehAvailabilityBelowTarget
        expr: bleh:probe_success:ratio_30d < 0.999
        labels: {severity: ticket}
        annotations:
          summary: "30-day availability for {{ $labels.target }} is {{ $value | humanizePercentage }} (< 99.9%)"
          runbook: docs/operations/observability.md#availability

      - alert: BlehProbeStale
        expr: time() - bleh_probe_last_run_timestamp_seconds > 300
        labels: {severity: ticket}
        annotations:
          summary: "External probe {{ $labels.target }} has not reported for 5 minutes"
          runbook: docs/operations/observability.md#availability

      - alert: BlehHttpEndpointDown
        expr: probe_success{job=~"blackbox-.*"} == 0
        for: 3m
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.instance }} fails its blackbox check"
          runbook: docs/operations/incident.md#public-endpoint-unavailable

      - alert: BlehCertificateExpiring
        expr: probe_ssl_earliest_cert_expiry - time() < 14 * 86400
        labels: {severity: ticket}
        annotations:
          summary: "Certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}"
          runbook: docs/operations/keys.md#tls-certificates

  - name: bleh-archive
    rules:
      - alert: BlehRawUploadStale
        # Node files rotate hourly; filtered and unfiltered raw must reach
        # object storage before the pruner may delete them.
        expr: time() - bleh_archive_raw_upload_last_success_timestamp_seconds > 7200
        labels: {severity: page}
        annotations:
          summary: "No {{ $labels.tier }} raw upload for {{ $labels.stream }} in 2 hours"
          runbook: docs/operations/incident.md#archive-capture-stalled

      - alert: BlehArchiveUploadFailures
        expr: increase(bleh_archive_upload_failures_total[30m]) > 5
        labels: {severity: ticket}
        annotations:
          summary: "Archive uploads failing ({{ $labels.tier }})"
          runbook: docs/operations/incident.md#archive-capture-stalled

      - alert: BlehManifestOverdue
        expr: time() - bleh_archive_manifest_last_success_timestamp_seconds > 26 * 3600
        labels: {severity: page}
        annotations:
          summary: "No signed manifest for {{ $labels.archive }} in 26 hours"
          runbook: docs/operations/incident.md#manifest-or-anchor-failure

      - alert: BlehManifestFailures
        expr: increase(bleh_archive_manifest_failures_total[1h]) > 0
        labels: {severity: ticket}
        annotations:
          summary: "Manifest build or signing failed for {{ $labels.archive }}"
          runbook: docs/operations/incident.md#manifest-or-anchor-failure

      - alert: BlehAnchorOverdue
        # OpenTimestamps proofs complete after Bitcoin confirmation, so the
        # window is longer than a day.
        expr: time() - bleh_archive_anchor_last_success_timestamp_seconds > 36 * 3600
        labels: {severity: ticket}
        annotations:
          summary: "No {{ $labels.anchor }} anchor for {{ $labels.archive }} in 36 hours"
          runbook: docs/operations/incident.md#manifest-or-anchor-failure

      - alert: BlehAnchorFailures
        expr: increase(bleh_archive_anchor_failures_total[6h]) > 2
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.anchor }} anchoring failing for {{ $labels.archive }}"
          runbook: docs/operations/incident.md#manifest-or-anchor-failure

      - alert: BlehContentHashMismatch
        # A replayed partition did not reproduce its canonical content hash.
        expr: increase(bleh_archive_content_hash_mismatch_total[1h]) > 0
        labels: {severity: page}
        annotations:
          summary: Replay produced a different canonical content hash
          runbook: docs/operations/incident.md#node-divergence

      - alert: BlehSigningFailures
        expr: increase(bleh_signing_failures_total[10m]) > 0
        labels: {severity: page}
        annotations:
          summary: "Signing failures in {{ $labels.job }} on {{ $labels.instance }}"
          runbook: docs/operations/keys.md#signing-failures

      - alert: BlehSwapPollStale
        # Part 43 repositories keep only a year online; capture is
        # time-critical.
        expr: time() - bleh_swap_poll_last_success_timestamp_seconds > 1800
        labels: {severity: ticket}
        annotations:
          summary: "Swap poller {{ $labels.source }} has not succeeded for 30 minutes"
          runbook: docs/operations/incident.md#swap-pollers-stalled

      - alert: BlehHistoryApiDown
        expr: up{job="history-api"} == 0
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: "history-api {{ $labels.instance }} is down (static history is unaffected)"
          runbook: docs/operations/incident.md#public-endpoint-unavailable

  - name: bleh-hosts
    rules:
      - alert: BlehNodeDiskLow
        expr: |
          node_filesystem_avail_bytes{mountpoint="/srv/hl"}
            / node_filesystem_size_bytes{mountpoint="/srv/hl"} < 0.20
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "Node data disk on {{ $labels.instance }} below 20% free"
          runbook: docs/operations/node.md#disk-and-pruning

      - alert: BlehNodeDiskCritical
        expr: |
          node_filesystem_avail_bytes{mountpoint="/srv/hl"}
            / node_filesystem_size_bytes{mountpoint="/srv/hl"} < 0.10
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "Node data disk on {{ $labels.instance }} below 10% free"
          runbook: docs/operations/node.md#disk-and-pruning

      - alert: BlehNodeDiskFillsIn24h
        expr: predict_linear(node_filesystem_avail_bytes{mountpoint="/srv/hl"}[6h], 86400) < 0
        for: 30m
        labels: {severity: ticket}
        annotations:
          summary: "Node data disk on {{ $labels.instance }} fills within 24 hours at the current rate"
          runbook: docs/operations/node.md#disk-and-pruning

      - alert: BlehDiskLow
        expr: |
          node_filesystem_avail_bytes{fstype=~"ext4|xfs",mountpoint!="/srv/hl"}
            / node_filesystem_size_bytes{fstype=~"ext4|xfs",mountpoint!="/srv/hl"} < 0.15
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} below 15% free"
          runbook: docs/operations/observability.md#hosts

      - alert: BlehPrunerFailing
        expr: bleh_hl_prune_ok == 0 or time() - bleh_hl_prune_last_run_timestamp_seconds > 3 * 3600
        labels: {severity: ticket}
        annotations:
          summary: "Node pruner failing or not running on {{ $labels.instance }}"
          runbook: docs/operations/node.md#disk-and-pruning

      - alert: BlehPrunerBlockedByCapture
        # Files older than the retention window are kept because the
        # archive has not confirmed them; disk will fill.
        expr: bleh_hl_prune_uncaptured_files > 0
        for: 2h
        labels: {severity: ticket}
        annotations:
          summary: "{{ $value }} node files past retention are waiting for archive capture on {{ $labels.instance }}"
          runbook: docs/operations/incident.md#archive-capture-stalled

      - alert: BlehClockOffsetHigh
        expr: abs(node_timex_offset_seconds) > 0.005
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: "Clock offset on {{ $labels.instance }} is {{ $value | humanizeDuration }} (> 5 ms)"
          runbook: docs/operations/observability.md#time-sync

      - alert: BlehClockUnsynchronised
        expr: node_timex_sync_status == 0
        for: 10m
        labels: {severity: page}
        annotations:
          summary: "Clock on {{ $labels.instance }} is not synchronised"
          runbook: docs/operations/observability.md#time-sync

      - alert: BlehHostExporterDown
        expr: up{job="node"} == 0
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: "node_exporter on {{ $labels.instance }} is down"
          runbook: docs/operations/observability.md#hosts

      - alert: BlehMemoryPressure
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.08
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.instance }} has less than 8% memory available"
          runbook: docs/operations/observability.md#hosts

      - alert: BlehRebootRequired
        expr: bleh_reboot_required == 1
        for: 7d
        labels: {severity: info}
        annotations:
          summary: "{{ $labels.instance }} has needed a reboot for security updates for 7 days"
          runbook: docs/operations/upgrades.md#host-os-updates

  - name: bleh-meta
    rules:
      - alert: Watchdog
        # Always firing. Route it to a dead man's switch so that a silent
        # Prometheus or Alertmanager is itself noticed.
        expr: vector(1)
        labels: {severity: none}
        annotations:
          summary: Alerting pipeline heartbeat
          runbook: docs/operations/observability.md#alert-routing
