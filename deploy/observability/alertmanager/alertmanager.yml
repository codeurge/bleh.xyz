# Alertmanager routing. Receivers read their URLs from files installed by
# the operator (never committed; see docs/operations/keys.md, "Operational
# secrets"):
#   /etc/alertmanager/secrets/page_webhook_url     paging (phone) webhook
#   /etc/alertmanager/secrets/ticket_webhook_url   chat or issue webhook
#   /etc/alertmanager/secrets/deadman_webhook_url  dead man's switch
# The two services hosts run Alertmanager as a cluster over the overlay
# (--cluster.peer), so each alert notifies once.
route:
  receiver: ticket
  group_by: [alertname, site, path]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [alertname="Watchdog"]
      receiver: deadman
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
    - matchers: [severity="page"]
      receiver: page
      repeat_interval: 1h
    - matchers: [severity="info"]
      receiver: blackhole

inhibit_rules:
  # When every path or gateway is down, the per-instance alerts are noise.
  - source_matchers: [alertname="BlehAllIngestPathsDown"]
    target_matchers: [alertname=~"BlehIngestPathDown|BlehPathBehind|BlehNodeBehindChain"]
  - source_matchers: [alertname="BlehAllGatewaysDown"]
    target_matchers: [alertname=~"BlehGatewayDown|BlehGatewayStalled|BlehGatewayUpstreamLost"]
  - source_matchers: [severity="page"]
    target_matchers: [severity="ticket"]
    equal: [alertname, instance]

receivers:
  - name: page
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/page_webhook_url
        send_resolved: true
  - name: ticket
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/ticket_webhook_url
        send_resolved: true
  - name: deadman
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/deadman_webhook_url
        send_resolved: false
  - name: blackhole
