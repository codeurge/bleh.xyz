# Dashboards are files in deploy/observability/grafana/dashboards, mounted
# read-only at /var/lib/grafana/dashboards. Edit them in the repository, not
# in the Grafana UI.
apiVersion: 1
providers:
  - name: bleh
    folder: bleh
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
