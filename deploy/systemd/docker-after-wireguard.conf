# Drop-in for docker.service (installed by host-bootstrap.sh as
# /etc/systemd/system/docker.service.d/10-bleh-wireguard.conf). Containers
# publish metrics on the WireGuard overlay address, which must exist before
# Docker binds it. Wants= (not Requires=) so Docker still starts on a host
# whose overlay is not configured yet.
[Unit]
Wants=wg-quick@bleh0.service
After=wg-quick@bleh0.service
