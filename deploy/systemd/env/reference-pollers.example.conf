# /etc/bleh/reference-pollers.env for bleh@reference-pollers.service on the
# home-archive server (alternative to the compose home-archive profile):
#   systemctl enable --now bleh@reference-pollers
# Flags and variables: docs/operations/reference-pollers.md.
#
# No credentials: every admitted source is read without an account or key.
# Host path /srv/bleh/reference holds raw/, state/, records/ (daily JSON
# lines and _notices.json) and archive/reference-backfill/; it must be
# writable by UID 65532. Metrics listen on loopback; Prometheus on the same
# host scrapes 127.0.0.1:9188.
BLEH_IMAGE=ghcr.io/codeurge/bleh.xyz/reference-pollers:REPLACE_WITH_SHA
BLEH_DOCKER_ARGS=-v /srv/bleh/reference:/var/lib/bleh/reference
BLEH_ARGS=run
RUST_LOG=info
REFERENCE_POLLERS_LOG_JSON=true
REFERENCE_POLLERS_LISTEN=127.0.0.1:9188
REFERENCE_POLLERS_RAW_DIR=/var/lib/bleh/reference/raw
REFERENCE_POLLERS_STATE_DIR=/var/lib/bleh/reference/state
REFERENCE_POLLERS_OUT_DIR=/var/lib/bleh/reference/records
REFERENCE_POLLERS_USER_AGENT=bleh.xyz reference-pollers (+https://bleh.xyz)
# Project role address appended to the User-Agent (BLS asks bulk clients
# for a contact); never a personal address.
REFERENCE_POLLERS_CONTACT=data@bleh.xyz
# Empty: every admitted source. Comma list of cot, treasury-rates,
# treasury-auctions, nyfed, frb-h15, frb-h10, usda-lmr, usda-dairy,
# usda-feeder, ercot, eia, bls.
REFERENCE_POLLERS_SOURCES=
REFERENCE_POLLERS_ERCOT_PRODUCTS=12331,12329,12301,24898
# BLS areas emitted: 0000 (U.S. city average) or a comma list, or all.
REFERENCE_POLLERS_BLS_AREAS=0000
