# /etc/bleh/gateway.env for bleh@gateway.service (live mode on a node box).
BLEH_IMAGE=ghcr.io/codeurge/bleh.xyz/gateway:REPLACE_WITH_SHA
BLEH_DOCKER_ARGS=
RUST_LOG=info
BLEH_SITE=a
BLEH_METRICS_ADDR=10.77.0.1:9102
BLEH_NATS_URL=nats://127.0.0.1:4222
GATEWAY_MODE=live
# Loopback: cloudflared (on this host) is the only client. Relays connect
# through the tunnel.
GATEWAY_LISTEN=127.0.0.1:8080
GATEWAY_UPSTREAMS=tcp://127.0.0.1:7400
GATEWAY_TRUSTED_PROXIES=127.0.0.1/32
GATEWAY_CLIENT_IP_HEADER=CF-Connecting-IP
