# /etc/bleh/hl-node-reader.env for bleh@hl-node-reader.service.
BLEH_IMAGE=ghcr.io/codeurge/bleh.xyz/hl-node-reader:REPLACE_WITH_SHA
BLEH_DOCKER_ARGS=-v /srv/hl/hl:/hl:ro -v /srv/hl/snapshots:/snapshots:ro -v /srv/bleh/raw:/var/lib/bleh/raw -v /etc/bleh/secrets/signing-key.hex:/run/secrets/signing_key:ro
RUST_LOG=info
BLEH_SITE=a
BLEH_METRICS_ADDR=10.77.0.1:9101
BLEH_NATS_URL=nats://127.0.0.1:4222
BLEH_SIGNING_KEY_FILE=/run/secrets/signing_key
READER_MODE=live
READER_PATH_ID=a
READER_NODE_DATA_DIR=/hl/data
READER_INFO_URL=http://127.0.0.1:3001/info
READER_SNAPSHOT_DIR=/snapshots
READER_STREAM_LISTEN=0.0.0.0:7400
READER_RAW_DIR=/var/lib/bleh/raw
