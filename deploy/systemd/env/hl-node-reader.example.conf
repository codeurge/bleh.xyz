# /etc/bleh/hl-node-reader.env for bleh@hl-node-reader.service.
# Variables: docs/operations/node-reader.md.
BLEH_IMAGE=ghcr.io/codeurge/bleh.xyz/hl-node-reader:REPLACE_WITH_SHA
BLEH_DOCKER_ARGS=-v /srv/hl/hl:/hl:ro -v /srv/hl/snapshots:/snapshots -v /srv/bleh/raw:/var/lib/bleh/raw -v /srv/bleh/reader:/var/lib/bleh/reader -v /etc/bleh/secrets/signing-key.hex:/run/secrets/signing_key:ro
RUST_LOG=info
HL_LOG_FORMAT=json
HL_NODE_DIRS=/hl/data
HL_INFO_URL=http://127.0.0.1:3001/info
HL_REGISTRY_OUT=/var/lib/bleh/reader/registry.json
HL_CHECKPOINT=/var/lib/bleh/reader/checkpoint.json
HL_SNAPSHOT_INTERVAL_SECS=600
HL_SNAPSHOT_PATH=/snapshots/l4.json
HL_METRICS_ADDR=10.77.0.1:9184
HL_OUTPUT=none
BLEH_SIGNING_KEY_FILE=/run/secrets/signing_key
BLEH_NATS_URL=nats://127.0.0.1:4222
