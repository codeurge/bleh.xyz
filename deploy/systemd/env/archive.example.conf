# /etc/bleh/archive.env for bleh-archive-daily and bleh-archive-anchors
# (deploy/scripts/archive-pipeline.sh). Object storage and keys come from
# deploy/compose/.env and secrets/ through the archive-job service.
ARCHIVE_MIRROR_DIR=/srv/archive
ARCHIVE_SCRATCH_DIR=/srv/scratch/archive
ARCHIVE_WEB_SEED=https://data.bleh.xyz/
ARCHIVE_DATA_URL=https://data.bleh.xyz
ARCHIVE_ICEBERG_LOCATION=s3://bleh-archive/hyperliquid-normalized
# Published manifest signer address; verify is skipped while empty.
ARCHIVE_TRUSTED_SIGNER=
# L2 chain id for anchors; empty skips L2 anchoring (chain not decided yet).
ARCHIVE_EVM_CHAIN_ID=
ARCHIVE_BITCOIN_API=https://blockstream.info/api
ARCHIVE_PROFILE=home-archive
