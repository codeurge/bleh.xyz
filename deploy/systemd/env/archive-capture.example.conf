# /etc/bleh/archive-capture.env for bleh@archive-capture.service: the
# standalone live capture (`archive capture run --follow`). Use it ONLY on a
# host where the origin does not capture (origin started without
# BLEH_RAW_DIR, or with BLEH_CAPTURE_DISABLED=true); two capturers on one
# node directory would race on the same staging tree and watermark.
#
# It follows the node's hourly files, writes the private and filtered tiers,
# seals and uploads each hour write-once, keeps
# /srv/bleh/raw/.captured-through current for hl-prune.sh (prune.env
# BLEH_RAW_DIR) and rewrites the capture counters every 60 s.
# Commands and variables: docs/operations/archive.md.
# This file holds R2 credentials: chmod 600.
BLEH_IMAGE=ghcr.io/codeurge/bleh.xyz/archive:REPLACE_WITH_SHA
BLEH_DOCKER_ARGS=-v /srv/hl/hl:/hl:ro -v /srv/bleh/raw:/var/lib/bleh/raw -v /var/lib/node_exporter/textfile:/textfile
BLEH_ARGS=capture run --follow --staging=/var/lib/bleh/raw --stream=fills=/hl/data/node_fills_by_block --stream=order_statuses=/hl/data/node_order_statuses_by_block --stream=raw_book_diffs=/hl/data/node_raw_book_diffs_by_block --upload --metrics-every-secs=60 --metrics-out=/textfile/bleh_archive_capture.prom --log-format=json
RUST_LOG=info
BLEH_ARCHIVE_PUBLIC_URL=s3://bleh-archive
BLEH_ARCHIVE_PUBLIC_ENDPOINT=https://ACCOUNT_ID.r2.cloudflarestorage.com
BLEH_ARCHIVE_PUBLIC_REGION=auto
BLEH_ARCHIVE_PUBLIC_ACCESS_KEY_ID=
BLEH_ARCHIVE_PUBLIC_SECRET_ACCESS_KEY=
BLEH_ARCHIVE_PRIVATE_URL=s3://bleh-raw-private
BLEH_ARCHIVE_PRIVATE_ENDPOINT=https://ACCOUNT_ID.r2.cloudflarestorage.com
BLEH_ARCHIVE_PRIVATE_REGION=auto
BLEH_ARCHIVE_PRIVATE_ACCESS_KEY_ID=
BLEH_ARCHIVE_PRIVATE_SECRET_ACCESS_KEY=
