# /etc/bleh/archive-capture.env for bleh@archive-capture.service on a node
# box (alternative to the compose service). Commands and variables:
# docs/operations/archive.md. This file holds R2 credentials: chmod 600.
BLEH_IMAGE=ghcr.io/codeurge/bleh.xyz/archive:REPLACE_WITH_SHA
BLEH_DOCKER_ARGS=-v /srv/hl/hl:/hl:ro -v /srv/bleh/archive:/var/lib/bleh/archive -v /var/lib/node_exporter/textfile:/textfile
BLEH_ARGS=capture run --staging=/var/lib/bleh/archive/staging --stream=fills=/hl/data/node_fills_by_block --stream=order_statuses=/hl/data/node_order_statuses_by_block --stream=raw_book_diffs=/hl/data/node_raw_book_diffs_by_block --upload --log-format=json --metrics-out=/textfile/bleh_archive_capture.prom
RUST_LOG=info
BLEH_ARCHIVE_PUBLIC_URL=s3://bleh-archive
BLEH_ARCHIVE_PUBLIC_ENDPOINT=https://ACCOUNT_ID.r2.cloudflarestorage.com
BLEH_ARCHIVE_PUBLIC_REGION=auto
BLEH_ARCHIVE_PUBLIC_ACCESS_KEY_ID=
BLEH_ARCHIVE_PUBLIC_SECRET_ACCESS_KEY=
BLEH_ARCHIVE_PRIVATE_URL=s3://bleh-raw-private
BLEH_ARCHIVE_PRIVATE_ENDPOINT=https://ACCOUNT_ID.r2.cloudflarestorage.com
BLEH_ARCHIVE_PRIVATE_REGION=auto
BLEH_ARCHIVE_PRIVATE_ACCESS_KEY_ID=
BLEH_ARCHIVE_PRIVATE_SECRET_ACCESS_KEY=
