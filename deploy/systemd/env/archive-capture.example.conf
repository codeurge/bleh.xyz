# /etc/bleh/archive-capture.env for bleh@archive-capture.service.
BLEH_IMAGE=ghcr.io/codeurge/bleh.xyz/archive:REPLACE_WITH_SHA
BLEH_DOCKER_ARGS=-v /srv/bleh/raw:/var/lib/bleh/raw -v /srv/bleh/archive:/var/lib/bleh/archive
RUST_LOG=info
BLEH_SITE=a
BLEH_METRICS_ADDR=10.77.0.1:9103
ARCHIVE_ROLE=capture
ARCHIVE_RAW_DIR=/var/lib/bleh/raw
ARCHIVE_WORK_DIR=/var/lib/bleh/archive
AWS_ENDPOINT=https://ACCOUNT_ID.r2.cloudflarestorage.com
AWS_REGION=auto
# Scoped R2 token; this file is root-only (chmod 600).
AWS_ACCESS_KEY_ID=
AWS_SECRET_ACCESS_KEY=
BLEH_PUBLIC_BUCKET=bleh-archive
BLEH_PRIVATE_BUCKET=bleh-raw-private
