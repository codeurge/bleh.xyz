# /etc/bleh/relay.env for bleh@relay.service on a relay VM (alternative to
# the compose relay profile). Flags: docs/operations/gateway.md, "Relay setup".
BLEH_IMAGE=ghcr.io/codeurge/bleh.xyz/gateway:REPLACE_WITH_SHA
BLEH_DOCKER_ARGS=
# Listens on all addresses so Caddy (loopback) and Prometheus (overlay)
# reach it; the host firewall admits 8080 only on loopback and the overlay.
BLEH_ARGS=relay --listen=0.0.0.0:8080 --trust-forwarded-for --upstream=ws://10.77.0.1:8080/v0/ws --signer=0xREPLACE_WITH_PUBLISHED_SIGNER
RUST_LOG=info
