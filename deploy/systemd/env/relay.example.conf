# /etc/bleh/relay.env for bleh@relay.service on a relay VM.
BLEH_IMAGE=ghcr.io/codeurge/bleh.xyz/gateway:REPLACE_WITH_SHA
BLEH_DOCKER_ARGS=-v /etc/bleh/secrets/upstream-headers.txt:/run/secrets/upstream_headers:ro
RUST_LOG=info
BLEH_SITE=relay-1
BLEH_METRICS_ADDR=10.77.0.11:9102
GATEWAY_MODE=relay
GATEWAY_LISTEN=127.0.0.1:8080
GATEWAY_UPSTREAMS=wss://origin-a.bleh.xyz/v0/ws
GATEWAY_UPSTREAM_HEADERS_FILE=/run/secrets/upstream_headers
BLEH_SIGNERS=
GATEWAY_TRUSTED_PROXIES=127.0.0.1/32
GATEWAY_CLIENT_IP_HEADER=X-Real-IP
