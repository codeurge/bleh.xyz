# /etc/bleh/relay.env for bleh@relay.service on a relay VM (alternative to
# the compose relay profile): systemctl enable --now bleh@relay.
# Every gateway flag has a BLEH_GATEWAY_* variable (docs/operations/gateway.md,
# "Configuration from the environment" and "Relay setup"); with
# BLEH_GATEWAY_MODE set the binary needs no arguments, so BLEH_ARGS stays
# unset. Lists are comma-separated; switches take true or false.
BLEH_IMAGE=ghcr.io/codeurge/bleh.xyz/gateway:REPLACE_WITH_SHA
BLEH_DOCKER_ARGS=
RUST_LOG=info
BLEH_GATEWAY_MODE=relay
# All addresses so Caddy (loopback) and Prometheus (overlay) reach it; the
# host firewall admits 8080 only on loopback and the overlay.
BLEH_GATEWAY_LISTEN=0.0.0.0:8080
# Caddy in front sets X-Forwarded-For.
BLEH_GATEWAY_TRUST_FORWARDED_FOR=true
# Origin gateways over the WireGuard overlay, in preference order (Tier 2:
# add the second node box, ws://10.77.0.3:8080/v0/ws).
BLEH_GATEWAY_UPSTREAM=ws://10.77.0.1:8080/v0/ws
# Published block-signer addresses, from the signed key list or the
# registry, never from the upstream (docs/operations/keys.md).
BLEH_GATEWAY_SIGNER=0xREPLACE_WITH_PUBLISHED_SIGNER
