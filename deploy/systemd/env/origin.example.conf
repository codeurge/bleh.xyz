# /etc/bleh/origin.env for bleh@origin.service on a node box (alternative
# to the compose node-box profile): systemctl enable --now bleh@origin.
# Flags and variables: docs/operations/origin.md; reader variables (HL_*):
# docs/operations/node-reader.md.
#
# With capture upload on, this file holds R2 credentials: chmod 600.
#
# Host paths: /srv/bleh/raw is the capture staging directory and holds the
# .captured-through watermark that hl-prune.sh reads (prune.env
# BLEH_RAW_DIR); /srv/bleh/reader holds the checkpoint and registry.json.
# The container runs as UID 65532: /etc/bleh/secrets/signing-key.hex must be
# readable by it (chown 65532 and chmod 0400). The textfile directory must
# be writable by group 65532
# (deploy/scripts/host-bootstrap.sh). The registry copy for the archive
# replay is made by the compose registry-sync service; without compose,
# copy /srv/bleh/reader/registry.json to
# s3://bleh-archive/_registry/hyperliquid/registry.json yourself.
BLEH_IMAGE=ghcr.io/codeurge/bleh.xyz/origin:REPLACE_WITH_SHA
BLEH_DOCKER_ARGS=-v /srv/hl/hl:/hl:ro -v /srv/hl/snapshots:/snapshots -v /srv/bleh/raw:/var/lib/bleh/raw -v /srv/bleh/reader:/var/lib/bleh/reader -v /var/lib/node_exporter/textfile:/textfile -v /etc/bleh/secrets/signing-key.hex:/run/secrets/signing_key:ro
RUST_LOG=info

# Reader.
HL_LOG_FORMAT=json
HL_NODE_DIRS=/hl/data
HL_INFO_URL=http://127.0.0.1:3001/info
HL_REGISTRY_OUT=/var/lib/bleh/reader/registry.json
HL_CHECKPOINT=/var/lib/bleh/reader/checkpoint.json
HL_SNAPSHOT_INTERVAL_SECS=600
HL_SNAPSHOT_PATH=/snapshots/l4.json
# Reader and origin metrics and /health: the overlay address.
HL_METRICS_ADDR=10.77.0.1:9184

# Signing, gateway, side tap.
BLEH_SIGNING_KEY_FILE=/run/secrets/signing_key
BLEH_SIGNING_KEY_ID=origin
# All addresses; the host firewall admits 8080 only on the overlay.
BLEH_GATEWAY_LISTEN=0.0.0.0:8080
# Optional: JetStream side tap (a NATS server on this host).
BLEH_NATS_URL=nats://127.0.0.1:4222

# Books. The archive replay must use the same checkpoint interval.
BLEH_BOOK_CHECKPOINT_SECS=600

# Live capture of the private and filtered raw tiers.
BLEH_RAW_DIR=/var/lib/bleh/raw
BLEH_CAPTURE_UPLOAD=true
BLEH_CAPTURE_METRICS_OUT=/textfile/bleh_archive_capture.prom
BLEH_ARCHIVE_PUBLIC_URL=s3://bleh-archive
BLEH_ARCHIVE_PUBLIC_ENDPOINT=https://ACCOUNT_ID.r2.cloudflarestorage.com
BLEH_ARCHIVE_PUBLIC_REGION=auto
BLEH_ARCHIVE_PUBLIC_ACCESS_KEY_ID=
BLEH_ARCHIVE_PUBLIC_SECRET_ACCESS_KEY=
BLEH_ARCHIVE_PRIVATE_URL=s3://bleh-raw-private
BLEH_ARCHIVE_PRIVATE_ENDPOINT=https://ACCOUNT_ID.r2.cloudflarestorage.com
BLEH_ARCHIVE_PRIVATE_REGION=auto
BLEH_ARCHIVE_PRIVATE_ACCESS_KEY_ID=
BLEH_ARCHIVE_PRIVATE_SECRET_ACCESS_KEY=
