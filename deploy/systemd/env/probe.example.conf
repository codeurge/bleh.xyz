# /etc/bleh/probe.env for bleh-probe.service (deploy/observability/prober/ws-probe.sh).
PROBE_URL=wss://live.bleh.xyz/v0/ws
PROBE_TARGET=live
PROBE_INSTRUMENT=hyperliquid:perp:BTC
PROBE_KIND=trade
PROBE_TIMEOUT=5
# websocat (if installed), mesh-client (binary on PATH) or docker (runs the
# tools image: PROBE_IMAGE).
PROBE_CLIENT=docker
# bleh/tools:local when built on the host by up.sh; with published images
# use ghcr.io/codeurge/bleh.xyz/tools:<sha> (the same SHA as .env BLEH_TAG).
PROBE_IMAGE=bleh/tools:local
TEXTFILE_DIR=/var/lib/node_exporter/textfile
