# Template for deploy/compose/.env (KEY=value, read by docker compose).
# deploy/up.sh copies it on first run and fills the generated values; edit
# .env, never this file, for real settings. .env is git-ignored. Keep it
# mode 0600: it holds the object-storage credentials.
#
# Secrets that are files (signing keys, tunnel token, alert webhooks) live
# in deploy/compose/secrets/ (git-ignored); see docs/operations/keys.md.

# --- Profile and images -------------------------------------------------
# synthetic | node-box | home-archive | relay  (up.sh sets this)
BLEH_PROFILE=synthetic
# Image prefix and tag: "bleh" + "local" for images built here by
# deploy/docker/build.sh, or ghcr.io/codeurge/bleh.xyz + a git SHA.
BLEH_REGISTRY=bleh
BLEH_TAG=local
# Site label on metrics and logs: a, b, home, relay-1, ...
BLEH_SITE=local
RUST_LOG=info

# WireGuard overlay address of this host (deploy/README.md, "Overlay").
# Metrics and Loki ports are published on it. Loopback keeps them local.
BLEH_OVERLAY_IP=127.0.0.1
# Loki on the home-archive server; other hosts ship logs there.
LOKI_URL=http://loki:3100

# --- Object storage -----------------------------------------------------
# Synthetic: MinIO (generated password). Production: Cloudflare R2, with
# S3_ENDPOINT=https://<account-id>.r2.cloudflarestorage.com and a scoped R2
# API token (write for node-box and home-archive, read-only for relays).
S3_ENDPOINT=http://minio:9000
S3_REGION=auto
S3_ALLOW_HTTP=true
S3_ACCESS_KEY_ID=bleh
S3_SECRET_ACCESS_KEY=__GENERATED__
# Path-style bucket addressing (MinIO needs it; R2 accepts it).
S3_PATH_STYLE=true
# Separate token for the private tier (unfiltered raw); defaults to the one
# above. The publishing host should not hold it (archive.md, "Object storage").
PRIVATE_S3_ACCESS_KEY_ID=
PRIVATE_S3_SECRET_ACCESS_KEY=
BLEH_PUBLIC_BUCKET=bleh-archive
BLEH_PRIVATE_BUCKET=bleh-raw-private
# Read-only token for the home archive mirror (optional; defaults to the
# token above).
MIRROR_S3_ACCESS_KEY_ID=
MIRROR_S3_SECRET_ACCESS_KEY=

# --- node-box -----------------------------------------------------------
HL_CHAIN=Mainnet
# Comma-separated gossip root IPs. Empty: fetched with gossipRootIps at
# start (the node README lists community-run roots as well).
HL_ROOT_NODE_IPS=
# Host paths on NVMe (host-bootstrap.sh creates and sets these). Leave
# empty locally to use named volumes. BLEH_RAW_DIR is the origin's capture
# staging directory and holds the .captured-through watermark hl-prune.sh
# reads (/etc/bleh/prune.env BLEH_RAW_DIR must be the same host path; with
# a named volume the pruner cannot see the watermark and keeps every stream
# file). BLEH_READER_DIR holds the reader checkpoint and registry.json.
HL_DATA_DIR=
HL_SNAPSHOT_DIR=
BLEH_RAW_DIR=
BLEH_READER_DIR=
# Tier 2: both nodes' data directories, comma-separated (the origin merges
# them; capture follows the first).
HL_NODE_DIRS=/hl/data
# Book checkpoint interval in seconds of block time. The origin and the
# archive replay (home-archive) must use the same value.
BLEH_BOOK_CHECKPOINT_SECS=600
# Key ID shown in /signers for the block-signing key (secrets/signing-key.hex).
BLEH_SIGNING_KEY_ID=origin

# --- home-archive -------------------------------------------------------
# Disk array for the full archive mirror (HDD is fine) and NVMe scratch for
# backfill and replay. Empty: named volumes.
ARCHIVE_MIRROR_DIR=
ARCHIVE_SCRATCH_DIR=
BACKFILL_SCRATCH_DIR=
# Ethereum L2 RPC for manifest anchors (L2 to be decided). Pipeline settings
# (signer to verify, chain id) live in /etc/bleh/archive.env.
ARCHIVE_L2_RPC_URL=
# Instrument registry for archive replay, as the archive-job container sees
# it. Empty: the origin's registry, which registry-sync on the node box
# copies to the public bucket and archive-mirror brings to
# /srv/archive/_registry/hyperliquid/registry.json. Synthetic:
# /fixtures/hl/markets.json.
ARCHIVE_REGISTRY=
# Replay book start: snapshot (empty here; as live) or empty (first
# recorded day).
ARCHIVE_BOOK_START=
SEEDER_PORT=6881
IPFS_SWARM_PORT=4101

SWAP_USER_AGENT=bleh.xyz swap-pollers (+https://bleh.xyz)
# Uncomment and leave empty to keep swap raw files local only (no S3 mirror).
#SWAP_RAW_MIRROR_BUCKET=
# Days a swap day must be in the past before swap-partition writes it.
SWAP_PARTITION_SETTLE_DAYS=2
# Self-hosted without object storage: a host directory holding the records
# archives, <dir>/reference-normalized and <dir>/swaps-normalized, written
# by the partitioners and signed in place by archive-pipeline.sh records
# (ADR 0017). Set HISTORY_API_ARCHIVE=/srv/normalized and
# HISTORY_API_ARCHIVE_NAMES=reference-normalized,swaps-normalized to serve
# them locally.
LOCAL_NORMALIZED_DIR=
# Reference pollers: generic user agent (never a person); sources to run
# (empty: every admitted source); ERCOT report types polled live.
REFERENCE_USER_AGENT=bleh.xyz reference-pollers (+https://bleh.xyz)
REFERENCE_SOURCES=
REFERENCE_ERCOT_PRODUCTS=12331,12329,12301,24898
# Days a reference day must be in the past before reference-partition
# writes it (covers the New York Fed's 10-day revision window).
REFERENCE_PARTITION_SETTLE_DAYS=12
# Web snapshots for the static site (docs/operations/web-snapshots.md).
# Empty: written to the web-snapshot volume only. Otherwise the public
# bucket's web/v0/ prefix, for example s3://bleh-archive/web/v0. Each
# WEB_SNAPSHOT_* store setting falls back to its S3_* one, so the snapshot
# can go to R2 while S3_* stays on a local MinIO. Use an R2 token that can
# write only that bucket. Each pass uploads only changed files plus
# latest.json: at 300 s that stays well inside R2's free write quota.
WEB_SNAPSHOT_URL=
WEB_SNAPSHOT_ENDPOINT=
WEB_SNAPSHOT_REGION=
WEB_SNAPSHOT_ALLOW_HTTP=
WEB_SNAPSHOT_PATH_STYLE=
WEB_SNAPSHOT_ACCESS_KEY_ID=
WEB_SNAPSHOT_SECRET_ACCESS_KEY=
WEB_SNAPSHOT_INTERVAL_SECS=300
PROMETHEUS_CONFIG=./prometheus/prometheus-synthetic.yml
PROMETHEUS_RETENTION=90d
GRAFANA_ROOT_URL=https://grafana.localhost:8443/
# Requester-pays access to Hyperliquid's public buckets for hl-backfill
# (an AWS IAM user with s3:GetObject and s3:ListBucket only).
BACKFILL_SOURCE_AWS_ACCESS_KEY_ID=
BACKFILL_SOURCE_AWS_SECRET_ACCESS_KEY=
# Bucket regions (docs/operations/backfill.md, "What the owner provides").
HL_NODE_DATA_REGION=
HL_ARCHIVE_REGION=

# --- relay --------------------------------------------------------------
# Origin gateways over the WireGuard overlay, in preference order (Tier 2:
# set the second to the other node box, ws://10.77.0.3:8080/v0/ws).
RELAY_UPSTREAM_1=ws://10.77.0.1:8080/v0/ws
RELAY_UPSTREAM_2=ws://10.77.0.1:8080/v0/ws
# Published block-signer addresses the relay accepts, taken from the signed
# key list or the registry, never from the upstream (docs/operations/keys.md).
BLEH_SIGNER_1=
BLEH_SIGNER_2=
RELAY_HOST=relay.localhost
# History API data root: the MinIO bucket locally, https://data.bleh.xyz in
# production, /srv/normalized for a self-hosted local archive
# (LOCAL_NORMALIZED_DIR). Public host names /mcp accepts.
HISTORY_API_ARCHIVE=http://minio:9000/bleh-archive
# Archive names under that root, unioned (comma-separated).
HISTORY_API_ARCHIVE_NAMES=hyperliquid-normalized
HISTORY_API_MCP_ALLOWED_HOSTS=localhost,api.localhost
# Set by up.sh synthetic: the demo gateway's signer address for relay-demo.
BLEH_DEMO_SIGNER=

# --- Edge (synthetic and relay) -----------------------------------------
BLEH_DOMAIN=localhost
# "internal" (local CA) or an ACME contact email for public certificates.
CADDY_TLS=internal
CADDY_HTTP_PORT=8080
CADDY_HTTPS_PORT=8443
# Relays behind the Cloudflare proxy: Cloudflare's published ranges
# (https://www.cloudflare.com/ips/); up.sh relay refreshes this line.
CADDY_TRUSTED_PROXIES=private_ranges
CADDY_ORIGIN_CERT_DIR=./secrets/origin-ca
