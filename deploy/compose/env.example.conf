# Template for deploy/compose/.env (KEY=value, read by docker compose).
# deploy/up.sh copies it on first run and fills the generated values; edit
# .env, never this file, for real settings. .env is git-ignored. Keep it
# mode 0600: it holds the object-storage credentials.
#
# Secrets that are files (signing keys, tunnel token, alert webhooks) live
# in deploy/compose/secrets/ (git-ignored); see docs/operations/keys.md.

# --- Profile and images -------------------------------------------------
# synthetic | node-box | home-archive | relay  (up.sh sets this)
BLEH_PROFILE=synthetic
# Image prefix and tag: "bleh" + "local" for images built here by
# deploy/docker/build.sh, or ghcr.io/codeurge/bleh.xyz + a git SHA.
BLEH_REGISTRY=bleh
BLEH_TAG=local
# Site label on metrics and logs: a, b, home, relay-1, ...
BLEH_SITE=local
RUST_LOG=info

# WireGuard overlay address of this host (deploy/README.md, "Overlay").
# Metrics and Loki ports are published on it. Loopback keeps them local.
BLEH_OVERLAY_IP=127.0.0.1
# Loki on the home-archive server; other hosts ship logs there.
LOKI_URL=http://loki:3100

# --- Object storage -----------------------------------------------------
# Synthetic: MinIO (generated password). Production: Cloudflare R2, with
# S3_ENDPOINT=https://<account-id>.r2.cloudflarestorage.com and a scoped R2
# API token (write for node-box and home-archive, read-only for relays).
S3_ENDPOINT=http://minio:9000
S3_REGION=auto
S3_ALLOW_HTTP=true
S3_ACCESS_KEY_ID=bleh
S3_SECRET_ACCESS_KEY=__GENERATED__
BLEH_PUBLIC_BUCKET=bleh-archive
BLEH_PRIVATE_BUCKET=bleh-raw-private
# Read-only token for the home archive mirror (optional; defaults to the
# token above).
MIRROR_S3_ACCESS_KEY_ID=
MIRROR_S3_SECRET_ACCESS_KEY=

# --- node-box -----------------------------------------------------------
HL_CHAIN=Mainnet
# Comma-separated gossip root IPs. Empty: fetched with gossipRootIps at
# start (the node README lists community-run roots as well).
HL_ROOT_NODE_IPS=
# Node data and raw output on NVMe (host-bootstrap.sh creates these).
# Leave empty locally to use named volumes.
HL_DATA_DIR=
HL_SNAPSHOT_DIR=
BLEH_RAW_DIR=
READER_PATH_ID=a
GATEWAY_UPSTREAMS=tcp://host.docker.internal:7400

# --- home-archive -------------------------------------------------------
# Disk array for the full archive mirror (HDD is fine) and NVMe scratch for
# backfill and replay. Empty: named volumes.
ARCHIVE_MIRROR_DIR=
ARCHIVE_SCRATCH_DIR=
BACKFILL_SCRATCH_DIR=
ARCHIVE_OTS_ENABLED=true
# Ethereum L2 RPC for manifest anchors (L2 to be decided).
ARCHIVE_L2_RPC_URL=
ARCHIVE_WEB_SEED_BASE=https://data.bleh.xyz
SEEDER_PORT=6881
IPFS_SWARM_PORT=4101
SWAP_SOURCES=cftc-dtcc,cftc-ice,sbsr-dtcc,sbsr-ice
SWAP_USER_AGENT=bleh.xyz swap-pollers (+https://bleh.xyz)
PROMETHEUS_CONFIG=./prometheus/prometheus-synthetic.yml
PROMETHEUS_RETENTION=90d
GRAFANA_ROOT_URL=https://grafana.localhost:8443/
# Requester-pays access to Hyperliquid's public buckets for hl-backfill
# (an AWS IAM user with s3:GetObject and s3:ListBucket only).
BACKFILL_SOURCE_AWS_ACCESS_KEY_ID=
BACKFILL_SOURCE_AWS_SECRET_ACCESS_KEY=
BACKFILL_SOURCE_REGION=ap-northeast-1

# --- relay --------------------------------------------------------------
# Origins in preference order (Cloudflare Tunnel hostnames, Access-gated).
RELAY_UPSTREAMS=wss://origin-a.bleh.xyz/v0/ws
# Published block-signer addresses the relay verifies (docs/operations/keys.md).
BLEH_SIGNERS=
RELAY_HOST=relay.localhost
HISTORY_DATA_URL=s3://bleh-archive

# --- Edge (synthetic and relay) -----------------------------------------
BLEH_DOMAIN=localhost
# "internal" (local CA) or an ACME contact email for public certificates.
CADDY_TLS=internal
CADDY_HTTP_PORT=8080
CADDY_HTTPS_PORT=8443
# Relays behind the Cloudflare proxy: Cloudflare's published ranges
# (https://www.cloudflare.com/ips/); up.sh relay refreshes this line.
CADDY_TRUSTED_PROXIES=private_ranges
CADDY_ORIGIN_CERT_DIR=./secrets/origin-ca
