# bleh.xyz stack: one compose file, one profile per host role. Start it with
# deploy/up.sh <profile>; settings come from deploy/compose/.env, created by
# up.sh from env.example.conf. Default production layout (ADR 0010):
#
#   node-box      rented box (16+ modern cores, 128 GB RAM free for the node,
#                 NVMe): Hyperliquid non-validating node and the `origin`
#                 service (reader, book builder, block signer and gateway in
#                 one process, live raw capture to R2, NATS side tap).
#                 Relays reach the gateway over the WireGuard overlay; no
#                 inbound HTTP ports.
#   home-archive  self-hosted home or LAN server: archive processing
#                 (replay, partitions, manifests, anchors), full archive
#                 mirror, BitTorrent seeder, IPFS pinning, backfill, swap
#                 pollers, staging history API, monitoring and alerting.
#                 Publishes through a Cloudflare Tunnel; no inbound ports.
#   relay         small public VM: gateway in relay mode (re-serves the
#                 signed stream; clients verify), history API, Caddy.
#
# Other profiles:
#   synthetic     laptop stack, no node: gateway demo mode, reader replaying
#                 fixtures/synthetic, archive to MinIO, history API, NATS,
#                 Prometheus, Grafana, Loki, Caddy with TLS on *.localhost.
#   node-box + home-archive together (deploy/up.sh origin): one self-hosted
#                 box that qualifies to run the node itself (Tier 0.5 in
#                 docs/operations/hosting.md).
#   backfill      one-off hl-backfill jobs (deploy/up.sh <profile> backfill ...).
#
# Networking: services share the "bleh" bridge network, except hl-node,
# origin and node-exporter, which use host networking (gossip on TCP
# 4001-4002; the node's info server listens on localhost:3001 and writes
# snapshots into a directory the origin reads). Bridge services reach the
# host as host.docker.internal. Metrics ports are published on
# BLEH_OVERLAY_IP (the WireGuard address; loopback by default) so the
# home-archive Prometheus can scrape the other hosts over the overlay.

name: bleh

x-bleh-service: &bleh-service
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=256m"]
  networks: [bleh]
  extra_hosts: ["host.docker.internal:host-gateway"]
  logging: &logging
    driver: json-file
    options: {max-size: "50m", max-file: "5"}

x-archive-env: &archive-env
  # docs/operations/archive.md, "Object storage": one store per tier.
  # PUBLIC_S3_* override S3_* for the public bucket only, so a host can
  # publish to R2 while S3_* stays on a local MinIO.
  BLEH_ARCHIVE_PUBLIC_URL: s3://${BLEH_PUBLIC_BUCKET:-bleh-archive}
  BLEH_ARCHIVE_PUBLIC_ENDPOINT: ${PUBLIC_S3_ENDPOINT:-${S3_ENDPOINT:-http://minio:9000}}
  BLEH_ARCHIVE_PUBLIC_REGION: ${PUBLIC_S3_REGION:-${S3_REGION:-auto}}
  BLEH_ARCHIVE_PUBLIC_ACCESS_KEY_ID: ${PUBLIC_S3_ACCESS_KEY_ID:-${S3_ACCESS_KEY_ID:-}}
  BLEH_ARCHIVE_PUBLIC_SECRET_ACCESS_KEY: ${PUBLIC_S3_SECRET_ACCESS_KEY:-${S3_SECRET_ACCESS_KEY:-}}
  BLEH_ARCHIVE_PUBLIC_ALLOW_HTTP: ${PUBLIC_S3_ALLOW_HTTP:-${S3_ALLOW_HTTP:-false}}
  BLEH_ARCHIVE_PUBLIC_PATH_STYLE: ${PUBLIC_S3_PATH_STYLE:-${S3_PATH_STYLE:-true}}
  BLEH_ARCHIVE_PRIVATE_URL: s3://${BLEH_PRIVATE_BUCKET:-bleh-raw-private}
  BLEH_ARCHIVE_PRIVATE_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  BLEH_ARCHIVE_PRIVATE_REGION: ${S3_REGION:-auto}
  BLEH_ARCHIVE_PRIVATE_ACCESS_KEY_ID: ${PRIVATE_S3_ACCESS_KEY_ID:-${S3_ACCESS_KEY_ID:-}}
  BLEH_ARCHIVE_PRIVATE_SECRET_ACCESS_KEY: ${PRIVATE_S3_SECRET_ACCESS_KEY:-${S3_SECRET_ACCESS_KEY:-}}
  BLEH_ARCHIVE_PRIVATE_ALLOW_HTTP: ${S3_ALLOW_HTTP:-false}
  BLEH_ARCHIVE_PRIVATE_PATH_STYLE: ${S3_PATH_STYLE:-true}

services:
  # ==================================================================
  # Shared infrastructure
  # ==================================================================
  nats:
    profiles: [synthetic, node-box, home-archive]
    image: docker.io/library/nats:2.15.3-alpine@sha256:558394a23dd3c36f2d3a64b51865fd09908010e80a542cea5e75c2af543ed62a
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      NATS_SERVER_NAME: bleh-${BLEH_SITE:-local}
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data
    ports:
      # Loopback only: the host-network origin publishes here.
      - "127.0.0.1:4222:4222"
    networks: [bleh]
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

  nats-exporter:
    profiles: [synthetic, node-box, home-archive]
    image: docker.io/natsio/prometheus-nats-exporter:0.20.3@sha256:4b8ddc1c86fec360b5cd3d5e1fbc6fb52bdafd5805bba3901cc52926538af255
    restart: unless-stopped
    command: ["-varz", "-jsz=all", "-connz", "-port", "7777", "http://nats:8222"]
    ports: ["${BLEH_OVERLAY_IP:-127.0.0.1}:7777:7777"]
    depends_on: [nats]
    networks: [bleh]
    logging: *logging

  node-exporter:
    profiles: [node-box, home-archive, relay]
    image: docker.io/prom/node-exporter:v1.12.1-distroless@sha256:8c9bac11973b94b59be88d6e11fee4429aa743c8846cdc75d65b18db33f6a106
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=${BLEH_OVERLAY_IP:-127.0.0.1}:9100
      - --collector.textfile.directory=/host/var/lib/node_exporter/textfile
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($|/)
    volumes:
      - /:/host:ro,rslave
    logging: *logging

  vector:
    profiles: [synthetic, node-box, home-archive, relay]
    image: docker.io/timberio/vector:0.61.0-distroless-libc@sha256:1a3451978644d5cd4b99a0b28c990791e2f7e1efbea4184122f1c59a56448143
    restart: unless-stopped
    command: ["--config", "/etc/vector/vector.yaml"]
    environment:
      BLEH_SITE: ${BLEH_SITE:-local}
      BLEH_ROLE: ${BLEH_PROFILE:-synthetic}
      # home-archive: http://loki:3100; other hosts: http://<home overlay IP>:3100
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      # Read-only access to container logs through the Docker API.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vector-data:/var/lib/vector
    networks: [bleh]
    extra_hosts: ["host.docker.internal:host-gateway"]
    logging: *logging

  # Cloudflare Tunnel: outbound-only publishing. Ingress rules (which
  # hostname maps to which service) live in the tunnel's remote
  # configuration (deploy/terraform/modules/cloudflare-tunnel) or, for a
  # locally managed tunnel, in cloudflared/config.example.yml.
  cloudflared:
    profiles: [home-archive]
    image: docker.io/cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run", "--token-file", "/run/secrets/tunnel_token"]
    secrets: [tunnel_token]
    networks: [bleh]
    logging: *logging

  # ==================================================================
  # node-box: Hyperliquid node and the live path
  # ==================================================================
  hl-node:
    profiles: [node-box]
    image: ${BLEH_REGISTRY:-bleh}/hl-node:${BLEH_TAG:-local}
    restart: unless-stopped
    network_mode: host
    stop_grace_period: 2m
    environment:
      HL_CHAIN: ${HL_CHAIN:-Mainnet}
      HL_ROOT_NODE_IPS: ${HL_ROOT_NODE_IPS:-}
    volumes:
      # Node output on the NVMe volume (host-bootstrap.sh: /srv/hl/hl).
      - ${HL_DATA_DIR:-hl-data}:/home/hluser/hl
      - ${HL_SNAPSHOT_DIR:-hl-snapshots}:/snapshots
    ulimits:
      nofile: {soft: 1048576, hard: 1048576}
    logging: *logging

  # The origin (docs/operations/origin.md): node reader, book builder,
  # block signer and gateway in one process, plus live capture of the
  # private and filtered raw tiers. Flags and variables:
  # crates/origin/src/config.rs; reader variables keep the HL_* names of
  # docs/operations/node-reader.md.
  origin:
    # Same hardening as x-bleh-service, spelled out because host networking
    # excludes the shared network settings.
    profiles: [node-box]
    image: ${BLEH_REGISTRY:-bleh}/origin:${BLEH_TAG:-local}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=256m"]
    logging: *logging
    network_mode: host
    # SIGTERM: the reader writes its checkpoint, gateway connections close
    # with 1001, capture keeps the open hour; exits within 25 s.
    stop_grace_period: 30s
    environment:
      <<: *archive-env
      RUST_LOG: ${RUST_LOG:-info}
      HL_LOG_FORMAT: json
      # One data directory per node; Tier 2 lists both (comma-separated),
      # the reader merges them and raises integrity alarms. Capture follows
      # the first.
      HL_NODE_DIRS: ${HL_NODE_DIRS:-/hl/data}
      HL_INFO_URL: http://127.0.0.1:3001/info
      # registry-sync copies registry.json to the public bucket for the
      # archive replay on the home-archive server.
      HL_REGISTRY_OUT: /var/lib/bleh/reader/registry.json
      HL_CHECKPOINT: /var/lib/bleh/reader/checkpoint.json
      # L4 snapshot every 10 minutes: books start from it and are
      # reconciled against it. The node writes the file and the origin
      # reads it at the same path.
      HL_SNAPSHOT_INTERVAL_SECS: ${HL_SNAPSHOT_INTERVAL_SECS:-600}
      HL_SNAPSHOT_PATH: /snapshots/l4.json
      # Reader and origin metrics and /health, on the overlay.
      HL_METRICS_ADDR: ${BLEH_OVERLAY_IP:-127.0.0.1}:9184
      BLEH_SIGNING_KEY_FILE: /run/secrets/signing_key
      BLEH_SIGNING_KEY_ID: ${BLEH_SIGNING_KEY_ID:-origin}
      # JetStream side tap; its window is replayed into the gateway on start.
      BLEH_NATS_URL: nats://127.0.0.1:4222
      # Embedded gateway (/v0/ws, /health, /freshness, /proof, /signers,
      # /metrics). All addresses: the host firewall admits 8080 only on the
      # overlay, where relays connect to ws://<overlay ip>:8080/v0/ws.
      BLEH_GATEWAY_LISTEN: 0.0.0.0:8080
      # Live capture: staging and the .captured-through watermark live in
      # BLEH_RAW_DIR, mounted from the host path hl-prune.sh reads
      # (.env BLEH_RAW_DIR, /srv/bleh/raw after host-bootstrap.sh).
      BLEH_RAW_DIR: /var/lib/bleh/raw
      BLEH_CAPTURE_UPLOAD: "true"
      BLEH_CAPTURE_METRICS_OUT: /textfile/bleh_archive_capture.prom
      # Must equal the archive replay's value (archive-job below).
      BLEH_BOOK_CHECKPOINT_SECS: ${BLEH_BOOK_CHECKPOINT_SECS:-600}
    volumes:
      - ${HL_DATA_DIR:-hl-data}:/hl:ro
      - ${HL_SNAPSHOT_DIR:-hl-snapshots}:/snapshots
      - ${BLEH_RAW_DIR:-raw}:/var/lib/bleh/raw
      - ${BLEH_READER_DIR:-reader-state}:/var/lib/bleh/reader
      # node_exporter textfile collector (capture counters).
      - /var/lib/node_exporter/textfile:/textfile
    secrets: [signing_key]
    depends_on: [hl-node, nats]

  # Raw capture runs inside origin. On a host where the origin does not
  # capture, `archive capture run --follow` is the standalone alternative
  # (deploy/systemd/env/archive-capture.example.conf).

  # Copies the origin's instrument registry to the public bucket every five
  # minutes (only when it changed). The archive replay on the home-archive
  # server reads it from its mirror (BLEH_ARCHIVE_REGISTRY in archive-job).
  # The registry is open metadata (docs/requirements.md, R7).
  registry-sync:
    profiles: [node-box]
    image: docker.io/rclone/rclone:1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # The reader state directory belongs to the runtime user (65532).
    user: "65532:65532"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while :; do
          if [ -s /var/lib/bleh/reader/registry.json ]; then
            rclone copyto --checksum /var/lib/bleh/reader/registry.json \
              ":s3:$${BLEH_PUBLIC_BUCKET}/_registry/hyperliquid/registry.json"
          fi
          sleep 300
        done
    environment:
      BLEH_PUBLIC_BUCKET: ${BLEH_PUBLIC_BUCKET:-bleh-archive}
      RCLONE_S3_PROVIDER: Cloudflare
      RCLONE_S3_ENDPOINT: ${PUBLIC_S3_ENDPOINT:-${S3_ENDPOINT:-}}
      RCLONE_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      RCLONE_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      RCLONE_S3_NO_CHECK_BUCKET: "true"
      RCLONE_CACHE_DIR: /tmp/rclone
    volumes:
      - ${BLEH_READER_DIR:-reader-state}:/var/lib/bleh/reader:ro
    tmpfs: ["/tmp:size=16m,uid=65532,gid=65532", "/config:size=1m,uid=65532,gid=65532"]
    networks: [bleh]
    logging: *logging
    depends_on: [origin]

  # ==================================================================
  # home-archive: processing, mirror, seeding, monitoring
  # ==================================================================
  # One-off archive CLI runs (replay, manifests, anchors, publish, verify),
  # started by deploy/scripts/archive-pipeline.sh from systemd timers, or by
  # hand: deploy/up.sh home-archive archive <command> ...
  # Replay needs the origin's instrument registry: registry-sync on the node
  # box copies it to the public bucket and archive-mirror brings it into the
  # mirror. Synthetic: ARCHIVE_REGISTRY=/fixtures/hl/markets.json.
  archive-job:
    <<: *bleh-service
    profiles: [archive-jobs]
    restart: "no"
    image: ${BLEH_REGISTRY:-bleh}/archive:${BLEH_TAG:-local}
    working_dir: /work
    environment:
      <<: *archive-env
      RUST_LOG: ${RUST_LOG:-info}
      BLEH_ARCHIVE_SIGNING_KEY_FILE: /run/secrets/manifest_key
      BLEH_ARCHIVE_KUBO_API: http://ipfs:5001
      BLEH_ARCHIVE_EVM_RPC: ${ARCHIVE_L2_RPC_URL:-}
      BLEH_ARCHIVE_EVM_KEY_FILE: /run/secrets/anchor_key
      BLEH_ARCHIVE_REGISTRY: ${ARCHIVE_REGISTRY:-/srv/archive/_registry/hyperliquid/registry.json}
      # snapshot (default): books wait for L4 snapshots, as live; empty: a
      # first recorded day. The checkpoint interval must equal the origin's.
      BLEH_ARCHIVE_BOOK_START: ${ARCHIVE_BOOK_START:-snapshot}
      BLEH_BOOK_CHECKPOINT_SECS: ${BLEH_BOOK_CHECKPOINT_SECS:-600}
    volumes:
      - ${ARCHIVE_SCRATCH_DIR:-archive-work}:/work
      - ${ARCHIVE_MIRROR_DIR:-archive-mirror}:/srv/archive:ro
      # Records archives (reference-normalized, swaps-normalized), signed
      # in place by archive-pipeline.sh records (ADR 0017).
      - ${LOCAL_NORMALIZED_DIR:-normalized}:/srv/normalized
      - ../../fixtures/synthetic:/fixtures:ro
    secrets: [manifest_key, anchor_key]
    tmpfs: ["/tmp:size=8g"]

  # Keeps a full copy of the public archive on the local disk array, the
  # source for seeding and pinning. Runs rclone once an hour.
  archive-mirror:
    profiles: [home-archive]
    image: docker.io/rclone/rclone:1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while :; do
          rclone sync --fast-list --checksum --transfers 8 \
            ":s3:$${BLEH_PUBLIC_BUCKET}" /srv/archive \
            && date +%s > /srv/archive/.last-sync
          sleep 3600
        done
    environment:
      BLEH_PUBLIC_BUCKET: ${BLEH_PUBLIC_BUCKET:-bleh-archive}
      RCLONE_S3_PROVIDER: Cloudflare
      RCLONE_S3_ENDPOINT: ${PUBLIC_S3_ENDPOINT:-${S3_ENDPOINT:-}}
      # A read-only R2 token is enough for the mirror.
      RCLONE_S3_ACCESS_KEY_ID: ${MIRROR_S3_ACCESS_KEY_ID:-${S3_ACCESS_KEY_ID:-}}
      RCLONE_S3_SECRET_ACCESS_KEY: ${MIRROR_S3_SECRET_ACCESS_KEY:-${S3_SECRET_ACCESS_KEY:-}}
    volumes:
      - ${ARCHIVE_MIRROR_DIR:-archive-mirror}:/srv/archive
    tmpfs: ["/tmp:size=64m", "/config:size=1m"]
    networks: [bleh]
    logging: *logging

  # Always-on BitTorrent v2 seeder for the daily torrents (web seeds point
  # at data.bleh.xyz). Seeds read-only from the mirror.
  seeder:
    profiles: [home-archive]
    image: docker.io/qbittorrentofficial/qbittorrent-nox:5.3.0-2@sha256:43b2d352cf76330a7ca34c7320b9b74227d6f31e662e0e123d0457206b09a7ea
    restart: unless-stopped
    environment:
      QBT_LEGAL_NOTICE: confirm
      QBT_WEBUI_PORT: "8090"
      QBT_TORRENTING_PORT: ${SEEDER_PORT:-6881}
    ports:
      # Optional port forward on the home router improves reachability;
      # without it the seeder still serves peers that accept connections.
      - "${SEEDER_PORT:-6881}:${SEEDER_PORT:-6881}/tcp"
      - "${SEEDER_PORT:-6881}:${SEEDER_PORT:-6881}/udp"
      - "127.0.0.1:8090:8090"
    volumes:
      - seeder-config:/config
      - ${ARCHIVE_MIRROR_DIR:-archive-mirror}:/srv/archive:ro
    networks: [bleh]
    logging: *logging

  # IPFS pinning node (Kubo). Swarm on 4101 so it never collides with the
  # Hyperliquid gossip ports when node-box and home-archive share a host.
  ipfs:
    profiles: [home-archive]
    image: docker.io/ipfs/kubo:v0.43.1@sha256:b293923d66e490e70ced64df42ea7a6cf7eac2740e3fb29101df18070fa7be48
    restart: unless-stopped
    environment:
      IPFS_PROFILE: server
    ports:
      - "${IPFS_SWARM_PORT:-4101}:4101/tcp"
      - "${IPFS_SWARM_PORT:-4101}:4101/udp"
      - "127.0.0.1:5001:5001"
    volumes:
      - ./ipfs/init.sh:/container-init.d/010-bleh.sh:ro
      - ipfs-data:/data/ipfs
      - ${ARCHIVE_MIRROR_DIR:-archive-mirror}:/srv/archive:ro
    networks: [bleh]
    logging: *logging

  swap-pollers:
    <<: *bleh-service
    profiles: [home-archive]
    image: ${BLEH_REGISTRY:-bleh}/swap-pollers:${BLEH_TAG:-local}
    # Flags and variables: docs/operations/swap-pollers.md.
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      SWAP_POLLERS_LOG_JSON: "true"
      SWAP_POLLERS_LISTEN: 0.0.0.0:9187
      SWAP_POLLERS_RAW_DIR: /var/lib/bleh/swap/raw
      SWAP_POLLERS_STATE_DIR: /var/lib/bleh/swap/state
      SWAP_POLLERS_OUT_DIR: /var/lib/bleh/swap/records
      SWAP_POLLERS_USER_AGENT: ${SWAP_USER_AGENT:-bleh.xyz swap-pollers}
      # Raw files are mirrored to the private bucket as they are captured.
      # Set SWAP_RAW_MIRROR_BUCKET empty in .env to keep raw files local only.
      SWAP_POLLERS_S3_BUCKET: ${SWAP_RAW_MIRROR_BUCKET-${BLEH_PRIVATE_BUCKET:-bleh-raw-private}}
      SWAP_POLLERS_S3_PREFIX: swap-raw
      SWAP_POLLERS_S3_ENDPOINT: ${S3_ENDPOINT:-}
      SWAP_POLLERS_S3_REGION: ${S3_REGION:-auto}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    ports: ["${BLEH_OVERLAY_IP:-127.0.0.1}:9187:9187"]
    volumes:
      - swap-data:/var/lib/bleh/swap

  # Partitions each settled day of swap records into the swaps-normalized
  # archive (archive partition-dir; docs/operations/archive.md, ADR 0017).
  # On a self-hosted server without object storage, LOCAL_NORMALIZED_DIR is
  # a host directory the history API can serve directly.
  swap-partition:
    <<: *bleh-service
    profiles: [home-archive]
    image: ${BLEH_REGISTRY:-bleh}/archive:${BLEH_TAG:-local}
    command: ["partition-dir", "--follow", "--log-format", "json"]
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      BLEH_PARTITION_DIR_RECORDS: /var/lib/bleh/swap/records
      BLEH_PARTITION_DIR_FILE: swap_print.jsonl
      BLEH_PARTITION_DIR_OUT: /srv/normalized/swaps-normalized
      BLEH_PARTITION_DIR_STATE: /var/lib/bleh/partition-state/swap
      BLEH_PARTITION_DIR_SETTLE_DAYS: ${SWAP_PARTITION_SETTLE_DAYS:-2}
    volumes:
      - swap-data:/var/lib/bleh/swap:ro
      - ${LOCAL_NORMALIZED_DIR:-normalized}:/srv/normalized
      - partition-state:/var/lib/bleh/partition-state

  reference-pollers:
    <<: *bleh-service
    profiles: [home-archive]
    image: ${BLEH_REGISTRY:-bleh}/reference-pollers:${BLEH_TAG:-local}
    # Admitted public reference sources (ADM-0005 to ADM-0013): rates,
    # settlement anchors, Commitments of Traders. Flags and variables:
    # docs/operations/reference-pollers.md.
    command: ["run"]
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      REFERENCE_POLLERS_LOG_JSON: "true"
      REFERENCE_POLLERS_LISTEN: 0.0.0.0:9188
      REFERENCE_POLLERS_RAW_DIR: /var/lib/bleh/reference/raw
      REFERENCE_POLLERS_STATE_DIR: /var/lib/bleh/reference/state
      REFERENCE_POLLERS_OUT_DIR: /var/lib/bleh/reference/records
      REFERENCE_POLLERS_USER_AGENT: ${REFERENCE_USER_AGENT:-bleh.xyz reference-pollers}
      REFERENCE_POLLERS_SOURCES: ${REFERENCE_SOURCES:-}
      REFERENCE_POLLERS_ERCOT_PRODUCTS: ${REFERENCE_ERCOT_PRODUCTS:-12331,12329,12301,24898}
    ports: ["${BLEH_OVERLAY_IP:-127.0.0.1}:9188:9188"]
    volumes:
      - reference-data:/var/lib/bleh/reference

  # Partitions settled days of reference records into the same normalized
  # archive. The settle period covers the New York Fed's 10-day revision
  # window; later revisions are reported, not rewritten
  # (docs/operations/archive.md, "Daily record files").
  reference-partition:
    <<: *bleh-service
    profiles: [home-archive]
    image: ${BLEH_REGISTRY:-bleh}/archive:${BLEH_TAG:-local}
    command: ["partition-dir", "--follow", "--log-format", "json"]
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      BLEH_PARTITION_DIR_RECORDS: /var/lib/bleh/reference/records
      BLEH_PARTITION_DIR_FILE: reference_value.jsonl,positioning.jsonl
      BLEH_PARTITION_DIR_OUT: /srv/normalized/reference-normalized
      BLEH_PARTITION_DIR_STATE: /var/lib/bleh/partition-state/reference
      BLEH_PARTITION_DIR_SETTLE_DAYS: ${REFERENCE_PARTITION_SETTLE_DAYS:-12}
    volumes:
      - reference-data:/var/lib/bleh/reference:ro
      - ${LOCAL_NORMALIZED_DIR:-normalized}:/srv/normalized
      - partition-state:/var/lib/bleh/partition-state

  # Web snapshots (archive snapshot; docs/operations/web-snapshots.md,
  # ADR 0016): small JSON files for the static site, built from the
  # pollers' record files. Written to the web-snapshot volume, and uploaded
  # to WEB_SNAPSHOT_URL (the public bucket's web/v0/ prefix) when set.
  web-snapshot:
    <<: *bleh-service
    profiles: [home-archive]
    image: ${BLEH_REGISTRY:-bleh}/archive:${BLEH_TAG:-local}
    command: ["snapshot", "--follow", "--log-format", "json"]
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      BLEH_SNAPSHOT_RECORDS: /var/lib/bleh/swap/records,/var/lib/bleh/reference/records
      BLEH_SNAPSHOT_OUT: /var/lib/bleh/web-snapshot
      BLEH_SNAPSHOT_INTERVAL_SECS: ${WEB_SNAPSHOT_INTERVAL_SECS:-300}
      BLEH_ARCHIVE_WEB_URL: ${WEB_SNAPSHOT_URL:-}
      # WEB_SNAPSHOT_* override S3_*, so the snapshot can go to the public
      # bucket while other services use a local store.
      BLEH_ARCHIVE_WEB_ENDPOINT: ${WEB_SNAPSHOT_ENDPOINT:-${S3_ENDPOINT:-}}
      BLEH_ARCHIVE_WEB_REGION: ${WEB_SNAPSHOT_REGION:-${S3_REGION:-auto}}
      BLEH_ARCHIVE_WEB_ACCESS_KEY_ID: ${WEB_SNAPSHOT_ACCESS_KEY_ID:-${S3_ACCESS_KEY_ID:-}}
      BLEH_ARCHIVE_WEB_SECRET_ACCESS_KEY: ${WEB_SNAPSHOT_SECRET_ACCESS_KEY:-${S3_SECRET_ACCESS_KEY:-}}
      BLEH_ARCHIVE_WEB_ALLOW_HTTP: ${WEB_SNAPSHOT_ALLOW_HTTP:-${S3_ALLOW_HTTP:-false}}
      BLEH_ARCHIVE_WEB_PATH_STYLE: ${WEB_SNAPSHOT_PATH_STYLE:-${S3_PATH_STYLE:-true}}
    volumes:
      - swap-data:/var/lib/bleh/swap:ro
      - reference-data:/var/lib/bleh/reference:ro
      - web-snapshot:/var/lib/bleh/web-snapshot

  # ==================================================================
  # History API: staging on home-archive, public on relays
  # ==================================================================
  history-api:
    <<: *bleh-service
    profiles: [synthetic, home-archive, relay]
    image: ${BLEH_REGISTRY:-bleh}/history-api:${BLEH_TAG:-local}
    # Flags and variables: docs/operations/history-api.md.
    command: ["serve"]
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      HISTORY_API_LOG_FORMAT: json
      # Synthetic: the MinIO bucket; production: https://data.bleh.xyz.
      HISTORY_API_ARCHIVE: ${HISTORY_API_ARCHIVE:-https://data.bleh.xyz}
      HISTORY_API_ARCHIVE_NAMES: ${HISTORY_API_ARCHIVE_NAMES:-hyperliquid-normalized}
      HISTORY_API_BIND: 0.0.0.0:8081
      HISTORY_API_TRUST_FORWARDED_FOR: "true"
      HISTORY_API_MCP_ALLOWED_HOSTS: ${HISTORY_API_MCP_ALLOWED_HOSTS:-localhost,api.localhost}
      HISTORY_API_QUERY_TIMEOUT_MS: ${HISTORY_API_QUERY_TIMEOUT_MS:-10000}
      HISTORY_API_MEMORY_LIMIT_MB: ${HISTORY_API_MEMORY_LIMIT_MB:-1024}
    # /metrics is served on the same port; published on the overlay only.
    ports: ["${BLEH_OVERLAY_IP:-127.0.0.1}:8081:8081"]
    # Self-hosted: HISTORY_API_ARCHIVE=/srv/normalized serves the local
    # normalized archive that swap-partition writes.
    volumes:
      - ${LOCAL_NORMALIZED_DIR:-normalized}:/srv/normalized:ro
    # DuckDB installs its httpfs extension under $HOME on first start.
    tmpfs: ["/tmp:size=2g", "/home/nonroot:size=512m,uid=65532,gid=65532"]

  # ==================================================================
  # relay: public fan-out
  # ==================================================================
  relay:
    <<: *bleh-service
    profiles: [relay]
    image: ${BLEH_REGISTRY:-bleh}/gateway:${BLEH_TAG:-local}
    # Flags: docs/operations/gateway.md ("Relay setup"). Upstreams are the
    # origins' gateways over the WireGuard overlay, in preference order;
    # every commitment is verified against the published signers before it
    # is re-served. Duplicated flags are harmless when there is one origin
    # or one signer.
    command:
      - relay
      - --listen=0.0.0.0:8080
      - --trust-forwarded-for
      - --upstream=${RELAY_UPSTREAM_1:-ws://10.77.0.1:8080/v0/ws}
      - --upstream=${RELAY_UPSTREAM_2:-ws://10.77.0.1:8080/v0/ws}
      - --signer=${BLEH_SIGNER_1:-0x0000000000000000000000000000000000000000}
      - --signer=${BLEH_SIGNER_2:-${BLEH_SIGNER_1}}
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    # /metrics on the listen port, published on the overlay for Prometheus.
    ports: ["${BLEH_OVERLAY_IP:-127.0.0.1}:8080:8080"]

  # ==================================================================
  # Edge (synthetic and relay) and monitoring (synthetic, home-archive)
  # ==================================================================
  caddy:
    profiles: [synthetic, relay]
    image: docker.io/library/caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "${CADDY_HTTP_PORT:-8080}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
      - "${CADDY_HTTPS_PORT:-8443}:443/udp"
    environment:
      BLEH_MODE: ${BLEH_PROFILE:-synthetic}
      BLEH_DOMAIN: ${BLEH_DOMAIN:-localhost}
      CADDY_TLS: ${CADDY_TLS:-internal}
      CADDY_TRUSTED_PROXIES: ${CADDY_TRUSTED_PROXIES:-private_ranges}
      RELAY_HOST: ${RELAY_HOST:-relay.localhost}
    volumes:
      - ./caddy:/etc/caddy:ro
      - ${CADDY_ORIGIN_CERT_DIR:-./secrets/origin-ca}:/etc/caddy-origin:ro
      - caddy-data:/data
      - caddy-config:/config
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.conf", "--adapter", "caddyfile"]
    networks: [bleh]
    logging: *logging

  prometheus:
    profiles: [synthetic, home-archive]
    image: docker.io/prom/prometheus:v3.16.0-distroless@sha256:e8b8fb0e336fe0affce6f9ea347b11d24975465fd3ba8119420186679c3efd5f
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-90d}
      - --web.enable-lifecycle
    volumes:
      - ${PROMETHEUS_CONFIG:-./prometheus/prometheus-synthetic.yml}:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    networks: [bleh]
    extra_hosts: ["host.docker.internal:host-gateway"]
    logging: *logging

  alertmanager:
    profiles: [synthetic, home-archive]
    image: docker.io/prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets/alertmanager:/etc/alertmanager/secrets:ro
      - alertmanager-data:/alertmanager
    ports: ["127.0.0.1:9093:9093"]
    networks: [bleh]
    logging: *logging

  blackbox:
    profiles: [synthetic, home-archive]
    image: docker.io/prom/blackbox-exporter:v0.29.1-distroless@sha256:4d6d2d50ecabf3a0b10e8f6f5c4b14fc0c2326dcc2f7fe161668de722d5bf61e
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ../observability/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks: [bleh]
    logging: *logging

  loki:
    profiles: [synthetic, home-archive]
    image: docker.io/grafana/loki:3.6.20@sha256:be040ec94865dabe4821ce1c0f109452bd4b5acb566ae376672696eb43caedb7
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ../observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports: ["${BLEH_OVERLAY_IP:-127.0.0.1}:3100:3100"]
    networks: [bleh]
    logging: *logging

  grafana:
    profiles: [synthetic, home-archive]
    image: docker.io/grafana/grafana:13.2.6@sha256:b21409d7951ddcfd63a4b49083e4ef2cc35bc1437d071813bf82bfb238b00bca
    restart: unless-stopped
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://grafana.localhost:8443/}
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    secrets: [grafana_admin_password]
    ports: ["127.0.0.1:3000:3000"]
    networks: [bleh]
    logging: *logging

  # ==================================================================
  # synthetic: laptop stack
  # ==================================================================
  minio:
    profiles: [synthetic]
    # MinIO no longer publishes community images on Docker Hub or Quay;
    # Chainguard's build is pinned by digest. Any S3-compatible server works
    # (Garage, SeaweedFS): only S3_ENDPOINT changes.
    image: cgr.dev/chainguard/minio@sha256:db3f583fa49121942168bd6383a773b2cde3384c9a99bf7193560b9a0f3a28fd
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-bleh}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks: [bleh]
    logging: *logging

  minio-init:
    profiles: [synthetic]
    image: docker.io/amazon/aws-cli:2.40.1@sha256:4ade0fe3e60e0b9e1fb0910f86c6d992baf4e12d3172c25a3c8c11f6c81cee08
    depends_on: [minio]
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-bleh}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: us-east-1
      PUBLIC_BUCKET: ${BLEH_PUBLIC_BUCKET:-bleh-archive}
      PRIVATE_BUCKET: ${BLEH_PRIVATE_BUCKET:-bleh-raw-private}
    entrypoint: ["/bin/sh", "/init/minio-init.sh"]
    volumes:
      - ./minio/minio-init.sh:/init/minio-init.sh:ro
    networks: [bleh]
    logging: *logging

  # Replays the synthetic fixtures once, writing the filtered-raw tree for
  # the archive, then exits (restart "no"). Rerun with
  # `deploy/up.sh synthetic restart hl-node-reader-replay`.
  hl-node-reader-replay:
    <<: *bleh-service
    profiles: [synthetic]
    restart: "no"
    image: ${BLEH_REGISTRY:-bleh}/hl-node-reader:${BLEH_TAG:-local}
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      HL_LOG_FORMAT: json
      HL_REPLAY: /fixtures/hl/base
      HL_REGISTRY: /fixtures/hl/markets.json
      HL_WRITE_FILTERED: /var/lib/bleh/raw/filtered
      HL_OUTPUT: none
      HL_METRICS_ADDR: 0.0.0.0:9184
      BLEH_SIGNING_KEY_FILE: /run/secrets/signing_key
    volumes:
      - ../../fixtures/synthetic:/fixtures:ro
      - raw:/var/lib/bleh/raw
    secrets: [signing_key]
    networks:
      bleh:
        aliases: [hl-node-reader]
    depends_on: [nats]

  gateway-demo:
    <<: *bleh-service
    profiles: [synthetic]
    image: ${BLEH_REGISTRY:-bleh}/gateway:${BLEH_TAG:-local}
    command:
      - demo
      - --listen=0.0.0.0:8080
      - --trust-forwarded-for
      - --signing-key=k1=file:/run/secrets/signing_key
      - --nats-url=nats://nats:4222
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    secrets: [signing_key]
    networks:
      bleh:
        aliases: [gateway]
    depends_on: [nats]

  # Started by up.sh in a second step (profile synthetic-relay), after it has
  # read the demo gateway's signer address from /signers.
  relay-demo:
    <<: *bleh-service
    profiles: [synthetic-relay]
    image: ${BLEH_REGISTRY:-bleh}/gateway:${BLEH_TAG:-local}
    command:
      - relay
      - --listen=0.0.0.0:8080
      - --trust-forwarded-for
      - --upstream=ws://gateway:8080/v0/ws
      - --signer=${BLEH_DEMO_SIGNER:-0x0000000000000000000000000000000000000000}
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      bleh:
        aliases: [relay]

  # ==================================================================
  # backfill: one-off jobs from Hyperliquid's public buckets (ADM-0003).
  # Commands and arguments: docs/operations/backfill.md, for example
  #   deploy/up.sh home-archive backfill estimate
  #   deploy/up.sh home-archive backfill copy --raw s3://bleh-raw-private/hl-archive ...
  # ==================================================================
  hl-backfill:
    <<: *bleh-service
    profiles: [backfill]
    restart: "no"
    image: ${BLEH_REGISTRY:-bleh}/hl-backfill:${BLEH_TAG:-local}
    working_dir: /var/lib/bleh/backfill
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      # Source: requester-pays AWS credentials (scoped IAM user).
      AWS_ACCESS_KEY_ID: ${BACKFILL_SOURCE_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKFILL_SOURCE_AWS_SECRET_ACCESS_KEY:-}
      HL_NODE_DATA_REGION: ${HL_NODE_DATA_REGION:-}
      HL_ARCHIVE_REGION: ${HL_ARCHIVE_REGION:-}
      # Destination: the raw tier on R2.
      BLEH_RAW_ENDPOINT: ${S3_ENDPOINT:-}
      BLEH_RAW_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      BLEH_RAW_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      BLEH_RAW_REGION: ${S3_REGION:-auto}
    volumes:
      - ${BACKFILL_SCRATCH_DIR:-backfill-work}:/var/lib/bleh/backfill
    tmpfs: ["/tmp:size=4g"]

  # One-off history import of the reference sources into the
  # reference-backfill archive (docs/operations/reference-pollers.md):
  #   docker compose --profile backfill run --rm reference-backfill \
  #     backfill --archive-root /var/lib/bleh/reference/archive/reference-backfill
  reference-backfill:
    <<: *bleh-service
    profiles: [backfill]
    restart: "no"
    image: ${BLEH_REGISTRY:-bleh}/reference-pollers:${BLEH_TAG:-local}
    command: ["backfill", "--archive-root", "/var/lib/bleh/reference/archive/reference-backfill"]
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      REFERENCE_POLLERS_LOG_JSON: "true"
      REFERENCE_POLLERS_STATE_DIR: /var/lib/bleh/reference/state
      REFERENCE_POLLERS_RAW_DIR: /var/lib/bleh/reference/raw
      REFERENCE_POLLERS_USER_AGENT: ${REFERENCE_USER_AGENT:-bleh.xyz reference-pollers}
      REFERENCE_POLLERS_SOURCES: ${REFERENCE_SOURCES:-}
    volumes:
      - reference-data:/var/lib/bleh/reference
    tmpfs: ["/tmp:size=1g"]

secrets:
  signing_key:
    file: ./secrets/signing-key.hex
  manifest_key:
    file: ./secrets/manifest-key.hex
  anchor_key:
    file: ./secrets/anchor-key.hex
  grafana_admin_password:
    file: ./secrets/grafana-admin-password.txt
  tunnel_token:
    file: ./secrets/tunnel-token.txt

networks:
  bleh:
    name: bleh

volumes:
  nats-data:
  minio-data:
  raw:
  swap-data:
  normalized:
  partition-state:
  reference-data:
  web-snapshot:
  reader-state:
  archive-work:
  archive-mirror:
  backfill-work:
  seeder-config:
  ipfs-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  alertmanager-data:
  loki-data:
  vector-data:
  grafana-data:
  hl-data:
  hl-snapshots:
