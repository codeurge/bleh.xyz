# NATS JetStream: the durability and replay side tap (ADR 0006). Never on
# the hot path and never a source for the archive. Production runs one
# independent server per site; subjects and retention are owned by the bus
# crate (crates/bus), which creates its streams on start.
server_name: $NATS_SERVER_NAME
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

max_payload: 8MB
max_pending: 64MB
write_deadline: "10s"

jetstream {
  store_dir: /data
  # Bounded replay window; the bus sets per-stream max_age within this.
  max_file_store: 50GB
  max_memory_store: 2GB
}

# Exposure: locally the server is reachable only on the compose network and
# 127.0.0.1. On production hosts it uses host networking, and the host
# firewall admits 4222 and 8222 only on loopback and the WireGuard overlay
# (deploy/scripts/host-bootstrap.sh), so no client credentials are needed
# for the side tap.
