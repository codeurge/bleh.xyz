# Sites for a public relay VM.
#
# {$RELAY_HOST} (for example relay-1.bleh.xyz) is this relay's own name,
# DNS-only, with a Let's Encrypt certificate (HTTP-01 on port 80). Clients
# and SDKs can rotate between relay names directly, which keeps working if
# the CDN front is unavailable.
#
# live.{$BLEH_DOMAIN} and api.{$BLEH_DOMAIN} reach every relay through the
# Cloudflare proxy, so an ACME challenge would land on a random relay.
# They use a Cloudflare Origin CA certificate instead (SSL mode Full
# (strict)), installed at /etc/caddy-origin/origin.pem and origin-key.pem
# (docs/operations/keys.md, "TLS certificates").

{$RELAY_HOST} {
	import common
	handle /v0/* {
		reverse_proxy relay:8080 {
			import to_backend
			stream_close_delay 5m
			flush_interval -1
		}
	}
	handle /health {
		reverse_proxy relay:8080
	}
	handle /freshness {
		reverse_proxy relay:8080
	}
	handle {
		reverse_proxy history-api:8081 {
			import to_backend
		}
	}
}

live.{$BLEH_DOMAIN} {
	tls /etc/caddy-origin/origin.pem /etc/caddy-origin/origin-key.pem
	encode zstd gzip
	reverse_proxy relay:8080 {
		import to_backend
		stream_close_delay 5m
		flush_interval -1
	}
}

api.{$BLEH_DOMAIN} {
	tls /etc/caddy-origin/origin.pem /etc/caddy-origin/origin-key.pem
	encode zstd gzip
	reverse_proxy history-api:8081 {
		import to_backend
	}
}
