# Sites for the synthetic (laptop) stack. Browse https://live.localhost:8443
# and friends; Caddy's internal CA signs the certificates (trust it with
# `docker compose exec caddy caddy trust`, or accept the warning).

live.{$BLEH_DOMAIN} {
	import no_metrics
	import common
	reverse_proxy gateway:8080 {
		import to_backend
		stream_close_delay 5m
		flush_interval -1
	}
}

relay.{$BLEH_DOMAIN} {
	import no_metrics
	import common
	reverse_proxy relay:8080 {
		import to_backend
		stream_close_delay 5m
		flush_interval -1
	}
}

api.{$BLEH_DOMAIN} {
	import no_metrics
	import common
	reverse_proxy history-api:8081 {
		import to_backend
	}
}

# Stands in for data.bleh.xyz (the R2 custom domain in production):
# read-only, CORS open for DuckDB-WASM, range requests pass through.
data.{$BLEH_DOMAIN} {
	import no_metrics
	import common
	header Access-Control-Allow-Origin *
	header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag"
	@write not method GET HEAD OPTIONS
	respond @write 405
	rewrite * /bleh-archive{uri}
	reverse_proxy minio:9000 {
		header_up Host minio:9000
	}
}

grafana.{$BLEH_DOMAIN} {
	import no_metrics
	import common
	@outside not client_ip private_ranges
	respond @outside 403
	reverse_proxy grafana:3000
}
