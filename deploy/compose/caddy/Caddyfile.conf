# Caddy: TLS and reverse proxy in front of the gateway, history API and
# (locally) the archive bucket. Named .conf because the repository only
# admits known extensions; run with `--adapter caddyfile`.
#
# Environment:
#   BLEH_MODE              synthetic | node | relay: selects sites-<mode>.conf
#   BLEH_DOMAIN            localhost (synthetic) or bleh.xyz (node mode)
#   CADDY_TLS              "internal" (local CA) or an ACME contact email
#   CADDY_TRUSTED_PROXIES  "private_ranges" locally; Cloudflare's published
#                          ranges in node mode behind the Cloudflare proxy
#                          (env.example.conf has the list)
#   RELAY_HOST             relay mode only: this relay's public hostname
{
	servers {
		trusted_proxies static {$CADDY_TRUSTED_PROXIES}
		client_ip_headers CF-Connecting-IP X-Forwarded-For
		metrics
	}
	# Admin API stays inside the container.
	admin localhost:2019
}

# Prometheus scrapes Caddy here (not published on the host).
http://:2020 {
	metrics /metrics
}

(common) {
	tls {$CADDY_TLS}
	encode zstd gzip
	header {
		Strict-Transport-Security "max-age=31536000"
		X-Content-Type-Options nosniff
		-Server
	}
	log {
		output stdout
		format json
	}
}

# Prometheus endpoints of the gateway and history API are for the overlay
# only; never serve them publicly.
(no_metrics) {
	@metrics path /metrics /metrics/*
	respond @metrics 404
}

(to_backend) {
	# The backend sees the real client IP in X-Real-IP; it trusts the header
	# only from the proxy network (GATEWAY_TRUSTED_PROXIES).
	header_up X-Real-IP {client_ip}
}


import sites-{$BLEH_MODE}.conf
