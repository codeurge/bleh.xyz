[package]
name = "gateway"
description = "Public websocket gateway and relay for the bleh.xyz mesh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum = { workspace = true, default-features = false, features = ["http1", "json", "query", "tokio"] }
bus.workspace = true
bytes.workspace = true
ciborium.workspace = true
clap = { workspace = true, features = ["env"] }
futures.workspace = true
hl-synth.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
mesh-client.workspace = true
mesh-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[[bench]]
name = "fanout"
harness = false

[lints]
workspace = true
