[package]
name = "history-api"
description = "Historical query API for the bleh.xyz mesh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
mesh-types.workspace = true

anyhow.workspace = true
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-schema.workspace = true
axum = { workspace = true, features = ["ws", "form", "query", "json", "tokio", "http1"] }
clap = { workspace = true, features = ["env"] }
# DuckDB is compiled from source (bundled) so the binary carries its own
# engine; the parquet and json extensions are built in. httpfs is loaded at
# run time only when the archive is remote (it would pull in OpenSSL, which
# deny.toml bans, if bundled). Default features are off because they enable
# `download-lib` (ureq and webpki-roots, whose CDLA license deny.toml does
# not allow); libduckdb-sys is named only to keep its `capi-v1` feature.
duckdb = { workspace = true, features = ["bundled", "parquet", "json"] }
libduckdb-sys = { workspace = true, features = ["capi-v1"] }
# Databento Binary Encoding (Apache-2.0), for the Databento-shaped endpoint.
dbn = { workspace = true, features = ["zstd"] }
futures.workspace = true
parquet.workspace = true
# Official Model Context Protocol SDK.
rmcp = { workspace = true, features = ["server", "transport-io", "transport-streamable-http-server"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time = { version = "0.3", default-features = false }
tokio.workspace = true
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["cors"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio-tungstenite.workspace = true

[lints]
workspace = true
