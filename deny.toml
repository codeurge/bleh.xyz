# cargo-deny policy. Run with `cargo deny check`; CI runs it on every change.
# Owned by the integrator (docs/decisions/0007-code-layout.md).

[graph]
all-features = true

[advisories]
# Known vulnerabilities and unmaintained crates fail the build; yanked
# versions too. Add an ignore only with a dated reason.
yanked = "deny"
ignore = [
    # 2026-11-13: both reach the tree only through revm, a dev-dependency of
    # crates/contracts (the in-process EVM for the Solidity verifier tests).
    # Nothing that ships links them.
    # crypto-bigint 0.5.5 (via k256 0.13 in alloy-eip7702) has no fixed 0.5
    # release; revm's k256 recovers public keys from public test data only,
    # and the shipped k256 0.14 uses crypto-bigint 0.7 (fixed).
    { id = "RUSTSEC-2026-0387", reason = "test-only via revm; no secret operands (2026-11-13)" },
    # paste (via alloy-primitives) is unmaintained; compile-time macros only.
    { id = "RUSTSEC-2024-0436", reason = "test-only via revm; unmaintained, no vulnerability (2026-11-13)" },
]

[licenses]
# Permissive licenses only, compatible with Apache-2.0 distribution and
# with releasing data under CC0.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # Permissive data license; used by webpki-root-certs (Mozilla CA roots)
    # pulled in by rustls through object_store and reqwest.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
# The allowlist is a policy, not an inventory: do not warn about unused entries.
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates are not published.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    # Keep TLS pure Rust (rustls) so builds are reproducible and portable.
    { name = "openssl", reason = "use rustls" },
    { name = "openssl-sys", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
