# Workspace root. Owned by the integrator: lanes do not edit this file
# (see docs/decisions/0007-code-layout.md).
[workspace]
resolver = "3"
members = [
    "crates/mesh-types",
    "crates/hl-node-reader",
    "crates/book",
    "crates/bus",
    "crates/gateway",
    "crates/archive",
    "crates/history-api",
    "tools/mesh-client",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/codeurge/bleh.xyz"
publish = false

# Shared dependency versions. A crate opts in with `name.workspace = true`.
# Entries that no member uses are never resolved or downloaded, so versions
# for the lanes' expected needs are declared here up front. A lane that needs
# something not listed adds it to its own Cargo.toml and asks the integrator
# to lift it here once a second crate needs it.
[workspace.dependencies]
mesh-types = { path = "crates/mesh-types" }

# Foundation (used by mesh-types and the tools).
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11"
sha3 = "0.12"
k256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
arrow-schema = "60"
thiserror = "2"

# Expected by the lanes (declared here, not yet used by any member).
anyhow = "1"
arrow-array = "60"
async-nats = "0.52"
axum = "0.8"
bytes = "1"
clap = { version = "4.6", features = ["derive"] }
duckdb = "1.20000"
futures = "0.3"
object_store = "0.14"
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
tokio = { version = "1.54", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
debug = "line-tables-only"
