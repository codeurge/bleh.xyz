# Build and promote bleh.xyz service images (docs/operations/deploy.md).
#
# - On a push to main that changes an image input (paths below): build every
#   service image from the commit, push to GHCR tagged with the full commit
#   SHA, attach SBOM and provenance, and sign with cosign (keyless, GitHub
#   OIDC). Relay images (gateway, history-api, tools) are multi-arch because
#   the default relays are arm64; node-box images (origin, hl-node, archive)
#   are amd64 only. deploy/docker/docker-bake.hcl builds every target in one
#   BuildKit session, so the workspace compiles once per platform, each on a
#   native runner (no emulation); the publish job then merges the platform
#   digests into one `<sha>` tag per image and signs it.
#   A newer push cancels a build still in progress, and a push that changes
#   no image input builds nothing, so not every commit on main has images.
#   Promote the latest commit that does (the promote job refuses one that
#   does not, at the signature check).
# - Manual promote: "Run workflow" on main with a commit SHA and an
#   environment. Nothing is deployed on push. The staging and production
#   GitHub environments carry protection rules (required reviewers;
#   deployment branches limited to main). Promotion verifies that every
#   image at that SHA was signed by this workflow on main, moves the
#   environment tag to those digests and, if the environment lists hosts,
#   updates each over SSH to that exact SHA. Rollback is the same action
#   with an earlier SHA (every image in the list below must exist at it).
#
# Environment configuration (Settings > Environments > staging|production):
#   vars.DEPLOY_HOSTS      space-separated "profile@user@host" entries, for
#                          example "node-box@ops@198.51.100.10 relay@ops@203.0.113.5"
#                          (the home-archive server is behind NAT and pulls
#                          the same SHA by hand: docs/operations/deploy.md)
#   secrets.DEPLOY_SSH_KEY private key of a deploy-only SSH user
#   secrets.DEPLOY_KNOWN_HOSTS  pinned host keys for those hosts
#
# Actions are pinned by commit SHA (version in the trailing comment), as in
# checks.yml.
name: deploy

on:
  push:
    branches: [main]
    # Everything the images are built from. COPY . . in the Dockerfile takes
    # the whole tree, but only these paths reach a binary.
    paths:
      - "crates/**"
      - "tools/**"
      - "docs/specs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".dockerignore"
      - "deploy/docker/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to promote (built by a previous run on main)
        required: true
        type: string
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]

# No default token permissions; each job asks for what it needs.
permissions: {}

concurrency:
  group: deploy-${{ github.event_name }}-${{ inputs.environment || 'build' }}
  # Builds: only the newest push matters. Promotions are never cancelled.
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  # GHCR names must be lower case.
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-latest}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The workspace build (every binary plus bundled DuckDB) outgrows the
      # runner's free disk, so drop preinstalled toolchains it never uses.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null
          df -h /

      - name: Commit time for reproducible timestamps
        id: meta
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Path context: the checkout holds only committed files, and the root
      # .dockerignore keeps .git and local junk out. No layer cache: the
      # compile layer changes with every commit and its cargo cache mounts
      # are not exported, so a cache would only fill the Actions cache quota.
      - name: Build and push by digest
        id: bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          VCS_REF: ${{ github.sha }}
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.epoch }}
        with:
          source: .
          files: deploy/docker/docker-bake.hcl
          targets: ${{ matrix.arch }}
          set: |
            *.platform=linux/${{ matrix.arch }}

      - name: Record digests
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p digests
          jq -r 'to_entries[] | select(.value["containerimage.digest"] != null)
                 | "\(.key) \(.value["containerimage.digest"])"' <<<"$METADATA" \
            | sort > "digests/${ARCH}.txt"
          cat "digests/${ARCH}.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 1

  # One `<sha>` tag per image over its platform digests (attestations are
  # carried over), signed by digest.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: write
      # cosign keyless signing.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and sign
        run: |
          set -euo pipefail
          # Keep in step with deploy/docker/docker-bake.hcl and the promote
          # job's list.
          amd64=(origin hl-node-reader gateway archive history-api swap-pollers reference-pollers hl-backfill tools hl-node)
          arm64=(gateway history-api tools)
          digest_of() { awk -v t="$2" '$1 == t { print $2 }' "digests/$1.txt"; }
          for t in "${amd64[@]}"; do
            sources=("${REGISTRY}/${t}@$(digest_of amd64 "$t")")
            if [[ " ${arm64[*]} " == *" ${t} "* ]]; then
              sources+=("${REGISTRY}/${t}@$(digest_of arm64 "$t")")
            fi
            for src in "${sources[@]}"; do
              [[ "$src" == *@sha256:* ]] || { echo "${t}: missing digest"; exit 1; }
            done
            docker buildx imagetools create --tag "${REGISTRY}/${t}:${GITHUB_SHA}" "${sources[@]}"
            digest=$(docker buildx imagetools inspect "${REGISTRY}/${t}:${GITHUB_SHA}" \
              --format '{{json .Manifest}}' | jq -r .digest)
            cosign sign --yes "${REGISTRY}/${t}@${digest}"
            echo "${t}: ${GITHUB_SHA} -> ${digest} (${#sources[@]} platform(s))"
          done

  promote:
    # The dispatch must run this file as it is on main, so a branch cannot
    # bring its own promote steps; environment rules gate who may run it.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      # Moving the environment tag writes to GHCR.
      packages: write
    env:
      SHA: ${{ inputs.sha }}
      ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - name: Check the SHA
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full commit SHA"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Every promoted image is signed by a main build (checked below); this
      # also refuses a SHA that is not on main for either environment.
      - name: Promote only commits on main
        run: git merge-base --is-ancestor "$SHA" origin/main

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify signatures and move the environment tag
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          images=(origin hl-node-reader gateway archive history-api swap-pollers reference-pollers hl-backfill tools hl-node)
          # Verify everything first, so a missing or unsigned image moves no tag.
          for t in "${images[@]}"; do
            cosign verify "${REGISTRY}/${t}:${SHA}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "https://github.com/${REPO}/.github/workflows/deploy.yml@refs/heads/main" \
              >/dev/null
            echo "${t}: signature verified"
          done
          for t in "${images[@]}"; do
            docker buildx imagetools create --tag "${REGISTRY}/${t}:${ENVIRONMENT}" "${REGISTRY}/${t}:${SHA}"
            echo "${t}: ${ENVIRONMENT} -> ${SHA}"
          done

      - name: Update hosts over SSH
        if: vars.DEPLOY_HOSTS != ''
        env:
          DEPLOY_HOSTS: ${{ vars.DEPLOY_HOSTS }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # One origin or relay at a time; stop at the first failure.
          for entry in $DEPLOY_HOSTS; do
            profile=${entry%%@*}
            target=${entry#*@}
            case "$profile" in
              node-box|home-archive|relay|origin) ;;
              *) echo "unknown profile '$profile' in DEPLOY_HOSTS"; exit 1 ;;
            esac
            echo "::group::${profile} on ${target#*@}"
            ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" \
              "sudo /opt/bleh/src/deploy/scripts/update-host.sh '$profile' '$SHA' '$REGISTRY'"
            echo "::endgroup::"
          done
          rm -f ~/.ssh/id_deploy
