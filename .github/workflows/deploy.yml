# Build and promote bleh.xyz service images (docs/operations/deploy.md).
#
# - On every push to main: build every service image from the commit, push
#   to GHCR tagged with the full commit SHA, attach SBOM and provenance, and
#   sign with cosign (keyless, GitHub OIDC). Relay images (gateway,
#   history-api, tools) are multi-arch because the default relays are arm64;
#   node-box images (origin, hl-node, archive) are amd64 only.
# - Manual promote: "Run workflow" on main with a commit SHA and an
#   environment. Nothing is deployed on push. The staging and production
#   GitHub environments carry protection rules (required reviewers;
#   deployment branches limited to main). Promotion verifies that every
#   image at that SHA was signed by this workflow on main, moves the
#   environment tag to those digests and, if the environment lists hosts,
#   updates each over SSH to that exact SHA. Rollback is the same action
#   with an earlier SHA (every image in the list below must exist at it).
#
# Environment configuration (Settings > Environments > staging|production):
#   vars.DEPLOY_HOSTS      space-separated "profile@user@host" entries, for
#                          example "node-box@ops@198.51.100.10 relay@ops@203.0.113.5"
#                          (the home-archive server is behind NAT and pulls
#                          the same SHA by hand: docs/operations/deploy.md)
#   secrets.DEPLOY_SSH_KEY private key of a deploy-only SSH user
#   secrets.DEPLOY_KNOWN_HOSTS  pinned host keys for those hosts
#
# Actions are pinned by commit SHA (version in the trailing comment), as in
# checks.yml.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to promote (built by a previous run on main)
        required: true
        type: string
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]

# No default token permissions; each job asks for what it needs.
permissions: {}

concurrency:
  group: deploy-${{ github.event_name }}-${{ inputs.environment || 'build' }}
  cancel-in-progress: false

env:
  # GHCR names must be lower case.
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
      # cosign keyless signing.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: origin, platforms: linux/amd64, file: deploy/docker/Dockerfile}
          - {target: hl-node-reader, platforms: linux/amd64, file: deploy/docker/Dockerfile}
          - {target: gateway, platforms: "linux/amd64,linux/arm64", file: deploy/docker/Dockerfile}
          - {target: archive, platforms: linux/amd64, file: deploy/docker/Dockerfile}
          - {target: history-api, platforms: "linux/amd64,linux/arm64", file: deploy/docker/Dockerfile}
          - {target: swap-pollers, platforms: linux/amd64, file: deploy/docker/Dockerfile}
          - {target: reference-pollers, platforms: linux/amd64, file: deploy/docker/Dockerfile}
          - {target: hl-backfill, platforms: linux/amd64, file: deploy/docker/Dockerfile}
          - {target: tools, platforms: "linux/amd64,linux/arm64", file: deploy/docker/Dockerfile}
          - {target: hl-node, platforms: linux/amd64, file: deploy/docker/hl-node/Dockerfile}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The workspace build (every binary plus bundled DuckDB) outgrows the
      # runner's free disk, so drop preinstalled toolchains it never uses.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null
          df -h /

      - name: Commit time for reproducible timestamps
        id: meta
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: contains(matrix.platforms, ',')
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Path context: the checkout holds only committed files, and the root
      # .dockerignore keeps .git and local junk out.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target != 'hl-node' && matrix.target || '' }}
          platforms: ${{ matrix.platforms }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.meta.outputs.epoch }}
            VCS_REF=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/${{ matrix.target }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,push=true,rewrite-timestamp=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.target }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  promote:
    # The dispatch must run this file as it is on main, so a branch cannot
    # bring its own promote steps; environment rules gate who may run it.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      # Moving the environment tag writes to GHCR.
      packages: write
    env:
      SHA: ${{ inputs.sha }}
      ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - name: Check the SHA
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full commit SHA"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Every promoted image is signed by a main build (checked below); this
      # also refuses a SHA that is not on main for either environment.
      - name: Promote only commits on main
        run: git merge-base --is-ancestor "$SHA" origin/main

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify signatures and move the environment tag
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          images=(origin hl-node-reader gateway archive history-api swap-pollers reference-pollers hl-backfill tools hl-node)
          # Verify everything first, so a missing or unsigned image moves no tag.
          for t in "${images[@]}"; do
            cosign verify "${REGISTRY}/${t}:${SHA}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "https://github.com/${REPO}/.github/workflows/deploy.yml@refs/heads/main" \
              >/dev/null
            echo "${t}: signature verified"
          done
          for t in "${images[@]}"; do
            docker buildx imagetools create --tag "${REGISTRY}/${t}:${ENVIRONMENT}" "${REGISTRY}/${t}:${SHA}"
            echo "${t}: ${ENVIRONMENT} -> ${SHA}"
          done

      - name: Update hosts over SSH
        if: vars.DEPLOY_HOSTS != ''
        env:
          DEPLOY_HOSTS: ${{ vars.DEPLOY_HOSTS }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # One origin or relay at a time; stop at the first failure.
          for entry in $DEPLOY_HOSTS; do
            profile=${entry%%@*}
            target=${entry#*@}
            case "$profile" in
              node-box|home-archive|relay|origin) ;;
              *) echo "unknown profile '$profile' in DEPLOY_HOSTS"; exit 1 ;;
            esac
            echo "::group::${profile} on ${target#*@}"
            ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" \
              "sudo /opt/bleh/src/deploy/scripts/update-host.sh '$profile' '$SHA' '$REGISTRY'"
            echo "::endgroup::"
          done
          rm -f ~/.ssh/id_deploy
