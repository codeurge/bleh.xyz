name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repository checks
        run: scripts/check.sh

      - name: DCO sign-off
        if: github.event_name == 'pull_request'
        run: scripts/check.sh --dco "${{ github.event.pull_request.base.sha }}"
