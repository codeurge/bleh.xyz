[package]
name = "mesh-client"
description = "Reference client for the bleh.xyz gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
bytes.workspace = true
ciborium.workspace = true
clap.workspace = true
futures.workspace = true
mesh-types.workspace = true
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true
# Bring your own feed (ADR 0014).
csv = "1.4"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
dbn = { workspace = true, features = ["zstd"], optional = true }
databento = { version = "0.64", default-features = false, features = ["live"], optional = true }

[features]
default = ["dbn-files"]
# DBN files the user holds (open format, Apache-2.0 `dbn` crate).
dbn-files = ["dep:dbn"]
# The vendor's live client, with the user's own key (off by default).
databento-live = ["dbn-files", "dep:databento"]

[dev-dependencies]
tempfile.workspace = true
time = "0.3"
zstd.workspace = true

[lints]
workspace = true
