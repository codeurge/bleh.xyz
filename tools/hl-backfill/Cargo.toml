[package]
name = "hl-backfill"
description = "Backfill from Hyperliquid's public archive buckets into the private raw tier, filtered raw and partitions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "hl-backfill"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
archive.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["env"] }
futures.workspace = true
hl-node-reader.workspace = true
lz4_flex = { version = "0.11", default-features = false, features = ["frame", "std"] }
mesh-types.workspace = true
object_store = { workspace = true, features = ["aws", "fs"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zstd.workspace = true

[dev-dependencies]
async-trait = "0.1"
history-api.workspace = true
hl-synth.workspace = true

[lints]
workspace = true
